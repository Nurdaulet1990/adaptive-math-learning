// ── Adaptive placement test ──
// Correct → jump 3 levels forward, Wrong → back 1, 2 consecutive wrong → stop.
// No visual blocks, silent skip on wrong, ability map at the end.

function genPlacementQ(levelId) {
  // Generate a text-only question {q, sub, answer} for any level
  const lv=levelId;
  if(lv==='c1') { const n=rand(1,9); return {q:`${n} — бұл қандай сан?`, sub:'Count the ones', answer:n}; }
  if(lv==='c20') { const n=rand(11,20); return {q:`1 ондық және ${n%10} бірлік = ?`, sub:'1 ten and ? ones', answer:n}; }
  if(lv==='ct10') { const t=rand(1,9); return {q:`${t} ондық = ?`, sub:'Count by tens', answer:t*10}; }
  if(lv==='c2') { const t=rand(1,9),o=rand(0,9); return {q:`${t} ондық ${o} бірлік = ?`, sub:'Tens and ones', answer:t*10+o}; }
  if(lv==='c3') { const h=rand(1,9),t=rand(0,9),o=rand(0,9); return {q:`${h} жүздік ${t} ондық ${o} бірлік = ?`, sub:'Hundreds, tens, ones', answer:h*100+t*10+o}; }
  if(lv==='c4') { const th=rand(1,3),h=rand(0,9),t=rand(0,9),o=rand(0,9); return {q:`${th} мыңдық ${h} жүздік ${t} ондық ${o} бірлік = ?`, sub:'Thousands', answer:th*1000+h*100+t*10+o}; }
  if(lv==='pv20') { const n=rand(11,19); return {q:`${n} санының ондық цифры қандай?`, sub:'Tens digit', answer:1}; }
  if(lv==='p1') { const n=rand(10,99),d=rand(0,1); const dig=d?Math.floor(n/10):n%10; return {q:`${n} — ${d?'ондық':'бірлік'} цифры?`, sub:'Place value', answer:dig}; }
  if(lv==='p2') { const n=rand(100,999),d=rand(0,2); const dig=[n%10,Math.floor(n/10)%10,Math.floor(n/100)][d]; const names=['бірлік','ондық','жүздік']; return {q:`${n} — ${names[d]} цифры?`, sub:'3-digit place value', answer:dig}; }
  if(lv==='p3') { const h=rand(1,9),t=rand(0,9),o=rand(0,9); return {q:`${h*100} + ${t*10} + ${o} = ?`, sub:'Expanded form', answer:h*100+t*10+o}; }
  if(lv==='pv4d') { const n=rand(1000,9999),d=rand(0,3); const dig=[n%10,Math.floor(n/10)%10,Math.floor(n/100)%10,Math.floor(n/1000)][d]; const names=['бірлік','ондық','жүздік','мыңдық']; return {q:`${n} — ${names[d]} цифры?`, sub:'4-digit place value', answer:dig}; }
  if(lv==='p4') { const th=rand(1,9),h=rand(0,9),t=rand(0,9),o=rand(0,9); return {q:`${th*1000} + ${h*100} + ${t*10} + ${o} = ?`, sub:'Build 4-digit', answer:th*1000+h*100+t*10+o}; }
  if(lv==='m1') { let a,b; do{a=rand(10,99);b=rand(10,99);}while(a===b); return {q:`${a} және ${b} — қайсысы үлкен?`, sub:'Compare (answer the bigger one)', answer:Math.max(a,b)}; }
  if(lv==='m2') { let a,b; do{a=rand(100,999);b=rand(100,999);}while(a===b); return {q:`${a} және ${b} — қайсысы үлкен?`, sub:'Compare', answer:Math.max(a,b)}; }
  if(lv==='m3') { let a,b; do{a=rand(1000,9999);b=rand(1000,9999);}while(a===b); return {q:`${a} және ${b} — қайсысы үлкен?`, sub:'Compare', answer:Math.max(a,b)}; }
  // Operations — just math, no visuals
  if(lv==='a1') { let a,b; do{a=rand(1,8);b=rand(1,8);}while(a+b>9); return {q:`${a} + ${b} = ?`, sub:'Add within 10', answer:a+b}; }
  if(lv==='s1') { const a=rand(2,9),b=rand(1,a); return {q:`${a} − ${b} = ?`, sub:'Sub within 10', answer:a-b}; }
  if(lv==='a20n') { let a,b; do{a=rand(10,18);b=rand(1,9);}while(a%10+b>=10||a+b>20); return {q:`${a} + ${b} = ?`, sub:'Add no carry', answer:a+b}; }
  if(lv==='a2') { let a,b; do{a=rand(2,9);b=rand(2,9);}while(a+b<=9); return {q:`${a} + ${b} = ?`, sub:'Add carry', answer:a+b}; }
  if(lv==='s20n') { let a; do{a=rand(11,19);}while(a%10===0); const b=rand(1,a%10); return {q:`${a} − ${b} = ?`, sub:'Sub no borrow', answer:a-b}; }
  if(lv==='s20b') { let a,b; do{a=rand(11,18);b=rand(a%10+1,9);}while(a-b<1); return {q:`${a} − ${b} = ?`, sub:'Sub borrow', answer:a-b}; }
  // 2-digit ops
  if(lv==='a3') { let a,b; do{a=rand(10,89);b=rand(10,89);}while(countCarries(a,b)!==0||a+b>99); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='a4') { let a,b; do{a=rand(10,89);b=rand(10,89);}while(countCarries(a,b)!==1||Math.floor(a/10)%10+Math.floor(b/10)%10>=10||a+b>99); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='a5') { let a,b; do{a=rand(10,89);b=rand(10,89);}while(!(a%10+b%10<10&&Math.floor(a/10)%10+Math.floor(b/10)%10>=10)); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='a6') { let a,b; do{a=rand(10,89);b=rand(10,89);}while(countCarries(a,b)<2); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='s2') { let a,b; do{a=rand(20,99);b=rand(10,a-1);}while(countBorrows(a,b)!==0); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  if(lv==='s3') { let a,b; do{a=rand(20,99);b=rand(10,a-1);}while(countBorrows(a,b)!==1); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  // 3-digit ops
  if(lv==='a7') { let a,b; do{a=rand(100,899);b=rand(100,899);}while(countCarries(a,b)!==0||a+b>999); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='a8'||lv==='a9'||lv==='a10') { let a,b,need=lv==='a8'?1:lv==='a9'?1:2; do{a=rand(100,899);b=rand(100,899);}while(countCarries(a,b)<need||a+b>999); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='s4') { let a,b; do{a=rand(200,999);b=rand(100,a-1);}while(countBorrows(a,b)!==0); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  if(lv==='s5'||lv==='s6'||lv==='s7') { let a,b,need=lv==='s5'?1:lv==='s6'?1:2; do{a=rand(200,999);b=rand(100,a-1);}while(countBorrows(a,b)<need); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  // 4-digit ops
  if(lv==='a4d1') { let a,b; do{a=rand(1000,4999);b=rand(1000,4999);}while(countCarries(a,b)!==0||a+b>9999); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='a4d2'||lv==='a4d3'||lv==='a4d4') { let a,b,need=lv==='a4d2'?1:lv==='a4d3'?2:3; do{a=rand(1000,4999);b=rand(1000,4999);}while(countCarries(a,b)<need||a+b>9999); return {q:`${a} + ${b} = ?`, answer:a+b}; }
  if(lv==='s4d1') { let a,b; do{a=rand(2000,9999);b=rand(1000,a-1);}while(countBorrows(a,b)!==0); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  if(lv==='s4d2'||lv==='s4d3'||lv==='s4d4') { let a,b,need=lv==='s4d2'?1:lv==='s4d3'?2:3; do{a=rand(2000,9999);b=rand(1000,a-1);}while(countBorrows(a,b)<need); return {q:`${a} − ${b} = ?`, answer:a-b}; }
  // Comprehension levels — simple arithmetic for placement
  if(lv==='u1') { const a=rand(2,9),b=rand(1,a); return {q:`${a} − ${b} = ?`, sub:'Түсіну: 10 ішінде', answer:a-b}; }
  if(lv==='u2') { const a=rand(5,9),b=rand(3,9); return {q:`${a} + ${b} = ?`, sub:'Түсіну: 20 ішінде', answer:a+b}; }
  if(lv==='u3') { const a=rand(20,60),b=rand(10,39); return {q:`${a} + ${b} = ?`, sub:'Түсіну: 100 ішінде', answer:a+b}; }
  if(lv==='u4') { const a=rand(100,500),b=rand(100,400); return {q:`${a} + ${b} = ?`, sub:'Түсіну: 1000 ішінде', answer:a+b}; }
  if(lv==='u5') { const a=rand(1000,5000),b=rand(1000,4000); return {q:`${a} + ${b} = ?`, sub:'Түсіну: 10000 ішінде', answer:a+b}; }
  // fallback
  return {q:'1 + 1 = ?', answer:2};
}

window.startDiagnostic = function() {
  state.started = true;
  state.placement = {
    active: true,
    currentIdx: 0,
    consecutiveWrong: 0,
    history: [],  // {idx, correct}
    maxReached: 0,
    questionCount: 0
  };
  saveProgress();
  renderPlacementQuestion();
};

function renderPlacementQuestion() {
  const p = state.placement;
  if(!p || !p.active) return;
  const idx = Math.max(0, Math.min(p.currentIdx, LEVEL_ORDER.length-1));
  const entry = LEVEL_ORDER[idx];
  const mod = MODULES.find(m=>m.id===entry.moduleId);
  const lvl = mod.levels.find(l=>l.id===entry.levelId);
  const qData = genPlacementQ(entry.levelId);
  p.questionCount++;

  const main = document.getElementById('main');
  main.innerHTML=`
    <div class="header">
      <h2>🎯 Деңгейді анықтау</h2>
      <span class="level-tag">${mod.icon} ${lvl.name}</span>
    </div>
    <div class="diag-progress">
      <span class="pt-num">Сұрақ ${p.questionCount}</span>
      <div class="diag-bar"><div class="diag-fill" style="width:${(idx/LEVEL_ORDER.length*100).toFixed(0)}%"></div></div>
    </div>
    <div class="pt-question-area pop-in">
      <div class="pt-q">${qData.q}</div>
      ${qData.sub?`<div class="pt-sub">${qData.sub}</div>`:''}
      <div class="answer-area" style="justify-content:center">
        <input type="number" class="answer-input" id="pt-ans" placeholder="?" autofocus>
        <button class="check-btn" onclick="checkPlacement(${qData.answer})">→</button>
      </div>
    </div>`;
  renderSidebar();
  const inp=document.getElementById('pt-ans');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkPlacement(qData.answer);});
  inp.focus();
}

window.checkPlacement = function(correctAnswer) {
  const p = state.placement;
  if(!p || !p.active) return;
  const inp = document.getElementById('pt-ans');
  if(!inp) return;
  const userAns = parseInt(inp.value);
  if(isNaN(userAns)) return;

  const correct = userAns === correctAnswer;
  p.history.push({idx: p.currentIdx, correct});

  if(correct) {
    p.consecutiveWrong = 0;
    p.maxReached = Math.max(p.maxReached, p.currentIdx);
    p.currentIdx = Math.min(p.currentIdx + 3, LEVEL_ORDER.length - 1);
    // If already at the end, finish
    if(p.currentIdx >= LEVEL_ORDER.length - 1 && p.maxReached >= LEVEL_ORDER.length - 1) {
      finishPlacement();
      return;
    }
  } else {
    p.consecutiveWrong++;
    if(p.consecutiveWrong >= 2) {
      finishPlacement();
      return;
    }
    p.currentIdx = Math.max(0, p.currentIdx - 1);
  }
  // Silent — just show next question, no feedback
  renderPlacementQuestion();
};

function finishPlacement() {
  const p = state.placement;
  // Determine the boundary: last level the student got right
  let lastCorrectIdx = -1;
  for(const h of p.history) {
    if(h.correct) lastCorrectIdx = Math.max(lastCorrectIdx, h.idx);
  }
  // Unlock all levels up to and including lastCorrectIdx, start from next
  if(lastCorrectIdx >= 0) {
    for(let i=0; i<=lastCorrectIdx; i++) {
      state.completed[LEVEL_ORDER[i].levelId] = true;
    }
    state.unlockedUpTo = Math.min(lastCorrectIdx + 1, LEVEL_ORDER.length - 1);
    state.stars += (lastCorrectIdx + 1) * 3; // auto-award stars
  } else {
    state.unlockedUpTo = 0;
  }
  state.placement = null;
  state.diagnostic = false;
  state.module = null;
  state.level = null;
  saveProgress();
  renderSidebar();
  showAbilityMap(lastCorrectIdx);
}

function showAbilityMap(lastCorrectIdx) {
  const main = document.getElementById('main');
  const startIdx = Math.min((lastCorrectIdx>=0?lastCorrectIdx+1:0), LEVEL_ORDER.length-1);
  const entry = LEVEL_ORDER[startIdx];
  const startMod = MODULES.find(m=>m.id===entry.moduleId);
  const startLvl = startMod.levels.find(l=>l.id===entry.levelId);

  let mapHTML = '<div class="ability-map">';
  for(const mod of MODULES) {
    const modLevels = mod.levels;
    const completedInMod = modLevels.filter(l=>state.completed[l.id]).length;
    const pct = Math.round(completedInMod / modLevels.length * 100);
    const isCurrentMod = mod.id === startMod.id;
    const allDone = completedInMod === modLevels.length;
    const fillClass = allDone ? 'mastered' : (completedInMod > 0 ? 'current' : 'locked');
    const badgeClass = allDone ? 'done' : (isCurrentMod ? 'active' : 'grey');
    const badgeText = allDone ? '✓ меңгерілді' : (isCurrentMod ? '← мұндасыз' : `${completedInMod}/${modLevels.length}`);
    mapHTML += `<div class="am-stage">
      <div class="am-icon">${mod.icon}</div>
      <div class="am-info">
        <div class="am-name">${mod.name}</div>
        <div class="am-bar"><div class="am-fill ${fillClass}" style="width:${pct}%"></div></div>
      </div>
      <span class="am-badge ${badgeClass}">${badgeText}</span>
    </div>`;
  }
  mapHTML += '</div>';

  main.innerHTML=`<div class="welcome">
    <div style="font-size:64px;margin-bottom:16px">🗺️</div>
    <h2>Сіздің деңгейіңіз анықталды!</h2>
    <p style="font-size:15px;color:var(--text-dim);margin:8px 0 24px">${startIdx} деңгей ашылды · ${state.stars} жұлдыз</p>
    ${mapHTML}
    <p style="margin-top:20px;font-size:15px">Келесі: <strong>${startMod.icon} ${startMod.name} — ${startLvl.name}</strong></p>
    <button class="check-btn" style="margin-top:16px;font-size:16px;padding:12px 32px" onclick="selectLevel('${entry.moduleId}','${entry.levelId}')">Бастау →</button>
  </div>`;
}

// ╔═══════════════════════════════════════════════════════════════╗
// ║  SYSTEM: LEVEL COMPLETION & PROGRESSION                     ║
// ║  Functions: showLevelComplete, goNextLevel                  ║
// ╚═══════════════════════════════════════════════════════════════╝
function showLevelComplete(ws) {
  // Mastery threshold: 4/5 for comprehension, 8/10 for regular
  const mastery = COMP_LVL.has(state.level) ? 4 : 8;
  const pct=Math.round(state.score/state.questionsPerLevel*100);
  const passed=state.score >= mastery;
  let unlockMsg = '';
  if(passed) {
    state.completed[state.level]=true;
    state.stars += state.score;
    // Unlock next level
    const curIdx = getLevelGlobalIndex(state.level);
    if(curIdx < LEVEL_ORDER.length - 1 && state.unlockedUpTo <= curIdx) {
      state.unlockedUpTo = curIdx + 1;
      const nextEntry = LEVEL_ORDER[curIdx + 1];
      const nextMod = MODULES.find(m=>m.id===nextEntry.moduleId);
      const nextLvl = nextMod.levels.find(l=>l.id===nextEntry.levelId);
      unlockMsg = `<p style="font-size:14px;color:var(--success);margin-top:8px">🔓 Жаңа деңгей ашылды: ${nextMod.icon} ${nextLvl.name}</p>`;
    }
    saveProgress();
    renderSidebar();
  }
  ws.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px">
      <div style="font-size:64px;margin-bottom:16px" class="star-anim">${passed?'🎉':'📚'}</div>
      <h2 style="font-size:28px;font-family:'Fredoka'">${passed?'Тамаша!':'Қайталап көріңіз'}</h2>
      <p style="font-size:18px;color:var(--text-dim);margin:12px 0">
        ${state.score} / ${state.questionsPerLevel} дұрыс (${pct}%)
      </p>
      <p style="font-size:13px;color:var(--text-dim)">Меңгеру табалдырығы: ${mastery}/${state.questionsPerLevel}</p>
      ${!passed?`<p style="font-size:13px;color:var(--error);margin-top:4px">Келесі деңгейге өту үшін кемінде ${mastery} дұрыс жауап қажет</p>`:''}
      <div style="display:flex;gap:4px;font-size:32px;margin:8px 0">
        ${'★'.repeat(state.score)}${'☆'.repeat(state.questionsPerLevel-state.score)}
      </div>
      ${unlockMsg}
      <div style="display:flex;gap:12px;margin-top:24px">
        <button class="check-btn" onclick="state.questionNum=0;state.score=0;state.total=0;generateQuestion();">Қайталау</button>
        ${passed?`<button class="next-btn" onclick="goNextLevel()">Келесі деңгей →</button>`:''}
      </div>
    </div>`;
}

window.goNextLevel = function() {
  // Use global ordering
  const curIdx = getLevelGlobalIndex(state.level);
  if(curIdx < LEVEL_ORDER.length - 1) {
    const next = LEVEL_ORDER[curIdx + 1];
    selectLevel(next.moduleId, next.levelId);
  } else {
    state.module = null;
    state.level = null;
    renderSidebar();
    renderMain();
  }
};

// ── Init ──
renderSidebar();
renderMain();
</script>
<div id="app"></div>
<script src="bridge.js"></script>
</body>
</html>
