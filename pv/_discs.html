<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Орын мәні · дискілер кестесі</title>
<link rel="stylesheet" href="../core/ui.css?v=9">
<style>
 body{padding:14px 12px 60px}
 h1{font-size:1.3rem;margin:0 0 4px} p.lead{color:var(--muted);font-size:.88rem;margin:0 0 16px}
 .fg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
 .fg h2{font-size:1rem;margin:0 0 8px;font-family:'Space Mono',monospace}
 .art{background:var(--fig);border-radius:10px;padding:8px;overflow-x:auto}
 .art svg{display:block;max-width:100%;height:auto}
 :root{--pv-th:#7E57C2;--pv-h:#E8A33D;--pv-t:#D9534F;--pv-o:#90A4AE}
</style></head><body>
<h1>Дискілер кестесі · айырбастаумен</h1>
<p class="lead">Дименшнс Математикадағы үлгі бойынша. Әлі бірде-бір деңгейге қосылған жоқ — алдымен қарап шығу үшін.</p>
<div id="out"></div>
<script src="discs.js?v=1"></script>
<script>
const CASES=[['628 − 356','sub',628,356],['274 − 92','sub',274,92],['809 − 324','sub',809,324],['715 − 682','sub',715,682],
             ['685 + 207','add',685,207],['49 + 326','add',49,326],['65 + 25','add',65,25],['408 + 507','add',408,507],
             ['4072 − 1385','sub',4072,1385],['2856 + 1247','add',2856,1247]];
document.getElementById('out').innerHTML=CASES.map(([t,op,a,b])=>
 `<div class="fg"><h2>${t}</h2><div class="art">${DISCS[op](a,b)}</div></div>`).join('');
</script></body></html>
