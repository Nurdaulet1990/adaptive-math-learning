<link rel="stylesheet" href="core/ui.css?v=11">
<style>
/* portal: one landscape strip per route */
.rt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:block;text-decoration:none;color:inherit;margin-bottom:10px}
.rt:hover{border-color:var(--rc)}
.rt.soon{opacity:.62;pointer-events:none}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px 7px}
.rt-name{font-family:var(--disp);font-weight:600;font-size:1.05rem;color:var(--rc)}
.rt-go{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);background:var(--fig);border-radius:999px;padding:3px 10px}
.rt>svg{width:100%;height:auto;display:block}
.rt-foot{display:flex;justify-content:space-between;padding:7px 13px 10px;font-size:.76rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
/* "continue" card: the whole card is one link back to the station the pupil touched last */
.go{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 18px;margin-bottom:12px}
.go small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
.go b{display:block;font-family:var(--disp);font-weight:600;font-size:1.5rem;line-height:1.2;margin:2px 0}
.go .go-sub{font-size:.88rem;font-weight:700;color:var(--muted)}
.go-bar{display:flex;align-items:center;gap:10px;margin:10px 0 14px;font-size:.8rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.go-bar div{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.go-bar i{display:block;height:100%;border-radius:999px;background:var(--rc)}
.go .btn{color:var(--accent-ink)}   /* dark theme: route colours are light there, white text on them is ~2.5:1 */
.go:active .btn{transform:translateY(4px);box-shadow:0 0 0 var(--rc-d)}
/* daily goal: ring + day streak + this week's dots */
.goal{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--ringc) var(--deg),var(--line) 0deg)}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring b{font-family:var(--disp);font-weight:600;font-size:1.5rem;line-height:1}
.ring span{font-size:.75rem;font-weight:800;color:var(--muted)}
.goal h2{margin:0 0 2px}
.goal p{margin:0;font-size:.95rem;font-weight:700;color:var(--muted)}
.goal p.hit{color:var(--good);font-weight:800}
.goal .fire{margin-top:5px;font-weight:800;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px;text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.week i{display:block;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;border:2px dashed var(--line)}
.week .done i{border:2px solid var(--good);background:var(--good-soft)}
.week .now{color:var(--ink)}
.week .now i{border:3px solid var(--gold);background:var(--gold-soft)}
.week .now.done i{border:3px solid var(--good);background:var(--good-soft)}
.week .miss i{border-style:solid;opacity:.55}
.brd-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--fig);border-radius:14px;padding:4px;margin:10px 0}
.brd-tabs button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.brd-tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.brd-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.brd-row:last-child{border-bottom:0}
.brd-row i{width:22px;font-style:normal;font-family:var(--disp);font-weight:600;color:var(--muted)}
.brd-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brd-me{margin-top:8px;padding:11px 12px;border-radius:14px;background:var(--accent-soft);border-bottom:0}
.brd-me small{display:block;font-size:.8rem;font-weight:800;color:var(--good)}
.brd-row small{display:block;font-size:.78rem;font-weight:800;color:var(--good)}
/* the star purse in the greeting line: a number a child can point at, not a badge to decode */
.purse{flex:none;display:inline-flex;align-items:center;gap:5px;text-decoration:none;padding:5px 12px 5px 13px;border-radius:999px;
  background:var(--gold-soft,#FBF2DC);border:1px solid var(--gold,#D99A1E);color:var(--ink);font-size:1.05rem;line-height:1}
.purse b{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}
.purse i{font-style:normal;color:var(--gold,#D99A1E)}
.brd-bar{height:14px;border-radius:999px;background:var(--fig);overflow:hidden;margin:4px 0 12px}
.brd-bar b{display:block;height:100%;border-radius:999px;background:var(--muted);opacity:.55}
.brd-bar b.mine{background:var(--accent);opacity:1}
.sec{font-family:var(--disp);font-weight:600;font-size:1.15rem;margin:16px 2px 8px}
/* ── tabs (look v3, step 2) ── */
.tabs .app{padding-bottom:200px}
.tab-h{margin:4px 2px 12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -1px 0 var(--line),0 -10px 24px -16px rgba(20,30,40,.35)}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:14px;text-decoration:none;
  color:var(--muted);font-weight:800;font-size:.74rem;transition:transform .09s,box-shadow .09s,background .15s}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:900;box-shadow:0 4px 0 var(--accent-d),var(--shine,inset 0 2px 0 rgba(255,255,255,.28))}
.tabbar a:active{transform:translateY(4px);box-shadow:none}
.tb-badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gold);color:#1B2733;font-size:.7rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--gold-d);animation:v3-pop .45s .4s both}
.tb-badge[hidden]{display:none}
.tabp{animation:v3-rise .25s cubic-bezier(.2,.8,.2,1)}
.go{box-shadow:var(--rim,0 4px 0 var(--line))}
.ib{border:2px solid var(--gold);padding:12px 14px 6px}
.ib h2{margin:0 0 4px;font-size:1.1rem}
.ib-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ib-row:first-of-type{border-top:0}
.ib-row>div{flex:1;min-width:0;display:flex;flex-direction:column}
.ib-row b{font-weight:900;font-size:.95rem}
.ib-row span{font-weight:700;font-size:.82rem;color:var(--muted)}
.ib-row span.good{color:var(--good)}
.ib-row i{font-style:normal;font-weight:900;color:var(--gold)}
.rk{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.rk-n{flex:none;width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 4px 0 var(--accent-d),inset 0 2px 0 rgba(255,255,255,.28)}
.rk-n b{font-family:var(--disp);font-weight:600;font-size:1.4rem}
.rk-n small{font-size:.62rem;font-weight:900}
.rk-m{flex:1;min-width:0}
.rk-m b{display:block;font-weight:900;font-size:.95rem;margin-bottom:6px}
.rk-bar{height:10px;border-radius:999px;background:var(--line);box-shadow:inset 0 2px 0 rgba(0,0,0,.07);overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.rk-w{flex:none;font-weight:800;font-size:.8rem;color:var(--good)}
/* ── class podium (look v3, step 4) ── */
.pod{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:12px 0 10px}
.pod-c{width:31%;display:flex;flex-direction:column;align-items:center;--pc:#C9D3DC;--pd:#9AA9B6;--h:66px}
.pod-c.p1{--pc:#F8D48A;--pd:#E0A22E;--h:96px}
.pod-c.p3{--pc:#EBC9A4;--pd:#C98A52;--h:46px}
.pod-a{animation:v3-bob 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(10,25,40,.18))}
.pod-a .pet{display:block}
.pod-nm{font-weight:900;font-size:.9rem;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-sc{font-weight:800;font-size:.78rem;color:var(--gold-d,#AC7813);margin-bottom:6px}
.pod-c.me .pod-nm{color:var(--accent)}
.pod-lid{width:92%;height:14px;background:var(--pc);border-radius:10px 10px 0 0;transform:perspective(120px) rotateX(38deg);transform-origin:bottom}
.pod-blk{width:92%;height:var(--h);background:var(--pd);border-radius:0 0 8px 8px;display:flex;justify-content:center;padding-top:6px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);transform-origin:bottom;animation:pod-up .55s cubic-bezier(.2,.9,.3,1.2) backwards}
.pod-c.p1 .pod-blk{animation-delay:.15s}.pod-c.p3 .pod-blk{animation-delay:.3s}
.pod-blk span{font-family:var(--disp);font-weight:600;font-size:1.6rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pod-c.me .pod-blk{box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 3px var(--accent)}
@keyframes pod-up{from{transform:scaleY(.2)}to{transform:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pod-c{--pc:#5C6A78;--pd:#43505D}
  :root:not([data-theme="light"]) .pod-c.p1{--pc:#B08630;--pd:#8A6620}:root:not([data-theme="light"]) .pod-c.p3{--pc:#94643A;--pd:#6F4A2A}}
.brd-row .pet{flex:none}
.ini{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fig);color:var(--muted);font-family:var(--disp);font-weight:600}
.pod .ini{font-size:1.6rem;margin-bottom:4px}
.rules{margin-top:10px}
.rules summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--accent);min-height:44px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){.pod-a,.pod-blk{animation:none!important}}
</style>

<body>
<div id="app" class="app"></div>
<script src="core/pets.js?v=1"></script>
<script src="core/core.js?v=16"></script>
<script src="room/routes.js?v=3"></script>
<script>
/* Portal: one login, then a landscape strip per route showing how far the pupil has walked. */
(async function(){
  const app=document.getElementById('app'); const esc=Core.esc;
  const {student,state}=await Core.login();
  const ava=Core.avatar();

  function progress(code){
    const s=state[code]; if(!s||!s.stages) return null;
    const ids=Object.keys(s.stages).sort();
    const passed=ids.filter(k=>s.stages[k].status==='passed').length;
    const cur=ids.findIndex(k=>s.stages[k].status==='current');
    const stars=ids.reduce((a,k)=>{ const t=s.stages[k].tests||[]; if(!t.length) return a; const b=t.reduce((m,x)=>Math.max(m,x.n?x.ok/x.n:0),0); return a+(b>=1?3:b>=0.9?2:b>=0.8?1:0); },0);
    return {passed,total:ids.length,cur:cur<0?passed:cur,stars,diag:!!s.diag};
  }
  /* a small road with n dots; `at` = index the pupil stands on (-1 = not started) */
  function strip(color,n,at){
    const W=320,H=62,x0=10,x1=W-10, N=Math.min(n,9), step=(x1-x0)/(N-1||1);
    const pts=[]; for(let i=0;i<N;i++) pts.push({x:x0+i*step, y:44+Math.sin(i*1.15)*8});
    let d=`M${pts[0].x},${pts[0].y}`; for(let i=1;i<N;i++){ const p=pts[i-1],q=pts[i]; d+=`C${p.x+step/2},${p.y} ${q.x-step/2},${q.y} ${q.x},${q.y}`; }
    const atS=at<0?-1:Math.min(N-1,Math.round(at*(N-1)/Math.max(n-1,1)));   // a finished route has at = n (no 'current' left): without the clamp pts[atS] was undefined and the whole portal crashed
    let done=''; if(atS>0){ done=`M${pts[0].x},${pts[0].y}`; for(let i=1;i<=atS;i++){ const p=pts[i-1],q=pts[i]; done+=`C${p.x+step/2},${p.y} ${q.x-step/2},${q.y} ${q.x},${q.y}`; } }
    let dots=''; pts.forEach((p,i)=>{ if(i===atS) return;
      dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${i<atS?color:'var(--road-edge)'}"/>`; });
    const me=atS>=0?`<circle cx="${pts[atS].x.toFixed(1)}" cy="${pts[atS].y.toFixed(1)}" r="9" fill="${color}" stroke="var(--card)" stroke-width="2"/>${window.Pets?`<g transform="translate(${(pts[atS].x-11).toFixed(1)},${(pts[atS].y-13).toFixed(1)})">${Pets.svg(ava,{head:true,size:22})}</g>`:`<text x="${pts[atS].x.toFixed(1)}" y="${(pts[atS].y+4).toFixed(1)}" text-anchor="middle" font-size="11">${ava}</text>`}`:'';
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">
      <rect width="${W}" height="${H}" fill="var(--sky2)" opacity=".5"/>
      <path d="M0,28 L40,8 L70,26 L110,3 L148,24 L186,7 L226,27 L266,9 L304,25 L320,15 L320,${H} L0,${H}Z" fill="var(--mtn-far)" opacity=".55"/>
      <path d="M0,40 C64,30 116,46 178,38 C238,30 284,44 320,35 L320,${H} L0,${H}Z" fill="var(--hill)" opacity=".6"/>
      <path d="${d}" fill="none" stroke="var(--road-edge)" stroke-width="10" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="var(--road)" stroke-width="7.5" stroke-linecap="round"/>
      ${done?`<path d="${done}" fill="none" stroke="${color}" stroke-width="7.5" stroke-linecap="round"/>`:''}
      ${dots}${me}</svg>`;
  }

  /* ── "continue": the live route the pupil answered in last (state[code].last), once it has a placement ── */
  function resume(){
    let best=null;
    Core.config.ROUTES.forEach(([code,name,url,status])=>{ const s=state[code]; if(status!=='live'||!s||!s.diag||!s.stages) return;
      if(!best||(s.last||0)>(best.s.last||0)) best={code,name,url,s}; });
    if(!best) return null;
    const ids=Object.keys(best.s.stages).sort(); if(!ids.length) return null;
    const passed=ids.filter(k=>best.s.stages[k].status==='passed').length;
    let ci=ids.findIndex(k=>best.s.stages[k].status==='current'); if(ci<0) ci=Math.min(passed,ids.length-1);   // PV may have no 'current'
    const st=best.s.stages[ids[ci]]||{};
    return {code:best.code,name:best.name,url:best.url,n:ci+1,total:ids.length,passed,level:st.level||1,streak:st.streak||0,allDone:passed>=ids.length};
  }
  /* ── daily goal and day streak, from Core.days() ──
     GOAL fills the ring. A day counts for the streak from DAY_MIN answers, so a slow pupil keeps the streak
     without reaching the goal. Saturday and Sunday never break a streak (school devices), but they count if used. */
  const GOAL=15, DAY_MIN=5;
  const days=Core.days(), today=new Date(), cnt=d=>days[Core.ymd(d)]||0;
  function dayStreak(){ let n=cnt(today)>=DAY_MIN?1:0; const d=new Date(today);
    for(let i=0;i<60;i++){ d.setDate(d.getDate()-1); if(cnt(d)>=DAY_MIN) n++; else if(d.getDay()===0||d.getDay()===6) continue; else break; }
    return n; }
  function goalCard(){
    const done=cnt(today), hit=done>=GOAL, deg=Math.round(Math.min(1,done/GOAL)*360), fire=dayStreak();
    const mon=new Date(today); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    const week=['Дс','Сс','Ср','Бс','Жм','Сн','Жк'].map((lb,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i);
      const isNow=Core.ymd(d)===Core.ymd(today), ok=cnt(d)>=DAY_MIN, past=d<today&&!isNow;
      return `<span class="${ok?'done':''}${isNow?' now':''}${past&&!ok&&i<5?' miss':''}"><i></i>${lb}</span>`; }).join('');
    return `<div class="card"><div class="goal"><div class="ring" style="--deg:${deg}deg;--ringc:var(--${hit?'good':'accent'})"><div><b>${done}</b><span>/ ${GOAL}</span></div></div>
      <div><h2>Бүгінгі мақсат</h2><p class="${hit?'hit':''}">${hit?'Мақсат орындалды! ★ +1':`Тағы ${GOAL-done} есеп қалды`}</p>${fire>=2?`<p class="fire">🔥 ${fire} күн қатарынан</p>`:''}</div></div>
      <div class="week">${week}</div></div>`;
  }

  /* The star purse. Route stars are in the state we already hold, so the number is on screen with the first paint;
     the board answers a moment later with the authoritative total, which also carries challenge and room stars,
     and #starTot is quietly corrected. A pupil with no class gets no board — the route total stands. */
  const routeStars=Core.config.ROUTES.reduce((a,[code])=>a+((progress(code)||{}).stars||0),0);
  const purse=`<a class="purse" href="#synyp" title="Жұлдыздар"><b id="starTot">${routeStars}</b><i>★</i></a>`;
  /* routeStars is what this device can work out on its own (stage tests, which live in the state). Practice,
     the daily goal, challenges and rooms are counted on the server, so the first paint is an undercount and
     esep_stars replaces it a moment later. Better a number that grows than a spinner.
     It asks for the pupil's OWN total, not the board's: the board begins «no class, no board», which used to
     leave a classless child staring at 0 ★ while the room card beside it said 11. */
  if(typeof Core.call==='function') Core.call('esep_stars',{}).then(v=>{
    const el=document.getElementById('starTot'); if(el&&v&&v.n!=null){ el.textContent=v.n; el.dataset.sure='1'; }
  }).catch(()=>{});

  const r=resume(), hello=`Сәлем, ${esc(student.name.split(' ')[0])}!`;
  /* ── four tabs (look v3, step 2) ─────────────────────────────────────────────────────────────────────────
     Бүгін: what to do now — continue, the day's goal, what is waiting (rooms, challenges), my place in class.
     Бағыттар: the five routes, the ones I have started first. Жарыс: rooms and challenges in full.
     Сынып: the class board. The tab lives in location.hash, so the phone's back button walks back through
     tabs and a link can open one (#synyp). Everything is still one page and one request set, as before. */
  let T1='', T2='', T3='', T4='';
  if(r){ const rc=r.code.toLowerCase();
    T1+=`<h1 style="margin:4px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px"><span>${hello}</span>${purse}</h1>
    <a class="go" href="${r.url}" style="--rc:var(--${rc},var(--accent));--rc-d:var(--${rc}-d,var(--accent-d))">
      <small>${esc(r.name)}</small><b>${r.allDone?'Барлық станция өтілді':r.n+'-станция'}</b>
      ${r.allDone||r.code==='PV'?'':`<span class="go-sub">Деңгей ${r.level}/3 · қатарынан ${r.streak}/3</span>`}
      <div class="go-bar"><div><i style="width:${Math.round(100*r.passed/r.total)}%"></i></div><span>${r.passed} / ${r.total}</span></div>
      <span class="btn wide">${r.allDone?'Қайталау':'Жалғастыру'}</span></a>`; }
  else T1+=`<div class="card"><h1 style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>${hello}</span>${purse}</h1><p>Бағытты таңда. Әр бағыт — өз жолы: станциядан станцияға жүресің.</p><a class="btn wide" href="#bagyt">Бағыттар</a></div>`;
  T1+=goalCard();
  T1+=`<div id="inbox"></div>`;     // filled from the rooms and challenges answers below
  T1+=`<div id="rankmini"></div>`;  // filled from the board
  T3+=`<h1 class="tab-h">Жарыс</h1><div id="rooms"></div>`;   // challenge rooms (esep_room_list) — empty until supabase/05_rooms.sql is installed
  T3+=`<div id="duel"></div>`;      // challenges from classmates (esep_ch_list) — empty until supabase/04_challenges.sql is installed
  T4+=`<h1 class="tab-h">Сынып${student.klass?' · '+esc(student.klass):''}</h1><div id="board"><div class="card"><p class="note" style="margin:0">Тақта жүктелуде…</p></div></div>`;
  T4+=`<div id="noclass"></div>`;   // shown only when the pupil has no class: the board cannot exist without one
  T2+=`<h1 class="tab-h">Бағыттар</h1>`;
  /* how many stations a route has, for the card a child sees BEFORE the placement test —
     after it, p.total is the real thing. Hard-coded because the portal does not load any
     route's stages.js. Keep in step with <route>/stages.js. */
  const COUNT={WP:13,FR:50,PV:48,AR:41,TE:20};
  const began=code=>{ const p=progress(code); return p&&p.diag?((state[code]||{}).last||1):0; };
  const order=Core.config.ROUTES.map((x,i)=>[x,i]).sort((a,b)=>(began(b[0][0])-began(a[0][0]))||(a[1]-b[1])).map(x=>x[0]);
  let newShown=false;
  order.forEach(([code,name,url,status,grades])=>{
    const p=progress(code), live=status==='live', color=`var(--${code.toLowerCase()},var(--accent))`;
    const total=p?p.total:(COUNT[code]||7);
    const at=p&&p.diag?p.cur:-1;
    if(!(p&&p.diag)&&!newShown&&order.some(([c])=>began(c))){ T2+=`<div class="sec">Жаңа бағыттар</div>`; newShown=true; }
    T2+=`<a class="rt${live?'':' soon'}" href="${live?url:'#'}" style="--rc:${color}">
      <div class="rt-head"><span class="rt-name">${esc(name)}</span><span class="rt-go">${live?(p&&p.diag?'жалғастыру':'бастау'):'жақында'}</span></div>
      ${strip(color,total,at)}
      <div class="rt-foot"><span>${p&&p.diag?`${p.passed} / ${total} станция`:`${total} станция · ${esc(grades)}-сынып`}</span><span>${p&&p.stars?'★ '+p.stars:''}</span></div></a>`;
  });
  T2+=`<div class="card" style="margin-top:12px"><p class="note">Мұғалім үшін: <a href="teacher/">есеп беру беті</a></p></div>`;
  const TABS=[['bugin','Бүгін','<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',T1],
              ['bagyt','Бағыттар','<path d="M4 19c4-1 3-6 8-7s5-6 8-7"/><circle cx="4" cy="19" r="1.5"/><circle cx="20" cy="5" r="1.5"/>',T2],
              ['jarys','Жарыс','<path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M12 13v4M8 20h8"/>',T3],
              ['synyp','Сынып','<path d="M5 20v-6M12 20V6M19 20v-9"/>',T4]];
  let html=Core.topbar()+TABS.map(([id,,,h])=>`<section class="tabp" id="t-${id}" hidden>${h}</section>`).join('')
    +`<nav class="tabbar" aria-label="Негізгі мәзір">${TABS.map(([id,lb,ic])=>`<a href="#${id}" data-t="${id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${lb}</span>${id==='jarys'?'<b class="tb-badge" id="jbadge" hidden></b>':''}</a>`).join('')}</nav>`;
  app.innerHTML=html; document.body.classList.add('tabs');
  const LEGACY={board:'synyp',rooms:'jarys',duel:'jarys'};
  function showTab(){ let t=(location.hash||'').slice(1); t=LEGACY[t]||t; if(!TABS.some(x=>x[0]===t)) t='bugin';
    TABS.forEach(([id])=>{ document.getElementById('t-'+id).hidden=id!==t; });
    document.querySelectorAll('.tabbar a').forEach(a=>{ if(a.dataset.t===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0,0); }
  addEventListener('hashchange',showTab); showTab();
  /* the Бүгін tab's «waiting for you» list: rooms and challenges each report in, and the list and the Жарыс badge are redrawn */
  const WAIT={rooms:[],duel:[]};
  /* Kazakh dative for a first name: Нұрлан → Нұрланға, Әли → Әлиге, Бекзат → Бекзатқа, Ерік → Ерікке */
  function dat(n){ n=String(n); const low=n.toLowerCase(), v=[...low].reverse().find(ch=>'аәеиоөұүыіэюяу'.includes(ch))||'а';
    const front='әеиөүіэ'.includes(v), last=low.slice(-1), hard='кқпстфхшщцч'.includes(last);
    return n+(hard?(front?'ке':'қа'):(front?'ге':'ға')); }
  function drawInbox(){ const rows=[...WAIT.rooms,...WAIT.duel], box=document.getElementById('inbox'), bd=document.getElementById('jbadge'); if(!box) return;
    const acts=rows.filter(x=>x.href).length; if(bd){ bd.hidden=!acts; bd.textContent=acts; }
    box.innerHTML=rows.length?`<div class="card ib"><h2>Сені күтіп тұр</h2>${rows.map(x=>`<div class="ib-row"><div><b>${x.t}</b><span${x.good?' class="good"':''}>${x.s}</span></div>${x.href?`<a class="btn gold sm" href="${x.href}">${x.go}</a>`:`<i>${x.go||''}</i>`}</div>`).join('')}</div>`:''; }

  /* ── classmate challenges: what is waiting for me, results of the ones I started, and the way in ── */
  const tbl=n=>(+n)+({2:'-ге',3:'-ке',4:'-ке',5:'-ке',6:'-ға',7:'-ге',8:'-ге',9:'-ға',10:'-ға'}[+n]||'-ге')+' көбейту';
  /* guarded: a device that still holds yesterday's core.js must lose only this card, not the rest of the page */
  if(typeof Core.call==='function') Core.call('esep_ch_list',{p_mark_seen:true}).then(l=>{ const box=document.getElementById('duel'); if(!box||!l) return; let h='';
    (l.incoming||[]).slice(0,3).forEach(c=>{ h+=`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><h2 style="margin:0 0 2px">${esc(String(c.from_name).split(' ')[0])} сені жарысқа шақырды</h2>
      <p style="margin:0 0 4px;font-weight:700">${esc(tbl(c.table))} · 10 есеп · екеуіңе бірдей</p><p class="note" style="margin:0 0 12px">Оның нәтижесі сен ойнап болғанша жасырын тұрады.</p>
      <a class="btn gold wide" href="challenge/?id=${+c.id}">Қабылдау</a></div>`; });
    (l.results||[]).filter(r=>r.new).forEach(r=>{ const nm=esc(String(r.opp_name).split(' ')[0]);
      h+=`<div class="card"><h2 style="margin:0 0 2px">${r.outcome==='win'?`${nm} жауап берді — сен жеңдің!`:r.outcome==='tie'?`${nm} жауап берді — тең!`:`${nm} жауап берді — бұл жолы ол озды`}</h2>
      <p style="margin:0;font-weight:700">${esc(tbl(r.table))}: сен ${+r.my_ok}/10, ${nm} ${+r.opp_ok}/10 · ★ +${+r.stars}</p></div>`; });
    /* the way in is a card of its own, always there — as a one-line link under the goal nobody found it */
    WAIT.duel=[...(l.incoming||[]).slice(0,3).map(c=>({t:`${esc(String(c.from_name).split(' ')[0])} сені шақырды`,s:`${esc(tbl(c.table))} · 10 есеп`,href:`challenge/?id=${+c.id}`,go:'Қабылдау'})),
      ...(l.results||[]).filter(r=>r.new).map(r=>{ const nm=esc(String(r.opp_name).split(' ')[0]); return {t:r.outcome==='win'?`${nm} жауап берді — сен жеңдің!`:r.outcome==='tie'?`${nm} жауап берді — тең!`:`${nm} жауап берді`,s:`${esc(tbl(r.table))}: ${+r.my_ok}/10 және ${+r.opp_ok}/10`,good:r.outcome==='win',go:`★ +${+r.stars}`}; })];
    drawInbox();
    h+=`<div class="card" id="duelGo" style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><h2 style="margin:0 0 2px">Сыныптаспен жарыс</h2>
      <p class="note" style="margin:0">Өзің өткен көбейту кестесі бойынша 10 есеп — екеуіңе бірдей${l.stars?` · ★ ${+l.stars}`:''}</p></div>
      <a class="btn gold" href="challenge/" style="white-space:nowrap">Шақыру</a></div>`;
    box.innerHTML=h; }).catch(()=>{});

  /* ── challenge rooms: the one I am in, my class's open rooms, and the way in. A station's name comes from the
        route's own stage table (room/routes.js), fetched only when there is a room to show. ── */
  if(typeof Core.call==='function'&&window.RoomRoutes) Core.call('esep_room_list').then(async l=>{ const box=document.getElementById('rooms'); if(!box||!l) return; let h='';
    const shown=l.mine?[l.mine]:(l.open||[]).slice(0,2), NM={}; await Promise.all([...new Set(shown.map(x=>x.route))].map(r=>RoomRoutes.stageNames(r).then(n=>{ NM[r]=n; }).catch(()=>{ NM[r]={}; })));
    const title=x=>((NM[x.route]||{})[x.stage]||{}).name||x.stage;
    if(l.mine) h+=`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><h2 style="margin:0 0 2px">${l.mine.status==='running'?'Жарыс жүріп жатыр!':l.mine.is_host?'Сенің бөлмең ашық':'Сен жарыс бөлмесіндесің'}</h2>
      <p style="margin:0 0 12px;font-weight:700">${esc(title(l.mine))} · код ${esc(l.mine.code)}</p><a class="btn gold wide" href="room/?id=${+l.mine.id}">Бөлмеге кіру</a></div>`;
    else shown.forEach(o=>{ h+=`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><h2 style="margin:0 0 2px">${o.by_teacher?'Мұғалім':esc(String(o.host_name).split(' ')[0])} жарыс бөлмесін ашты</h2>
      <p style="margin:0 0 12px;font-weight:700">${esc(title(o))} · ${+o.n} ойыншы күтіп тұр</p><a class="btn gold wide" href="room/?code=${encodeURIComponent(o.code)}">Қосылу</a></div>`; });
    WAIT.rooms=l.mine?[{t:l.mine.status==='running'?'Жарыс жүріп жатыр!':l.mine.is_host?'Сенің бөлмең ашық':'Сен бөлмедесің',s:`${esc(title(l.mine))} · код ${esc(l.mine.code)}`,href:`room/?id=${+l.mine.id}`,go:'Кіру'}]
      :shown.map(o=>({t:`${o.by_teacher?'Мұғалім':esc(String(o.host_name).split(' ')[0])} бөлме ашты`,s:`${esc(title(o))} · ${+o.n} ойыншы`,href:`room/?code=${encodeURIComponent(o.code)}`,go:'Қосылу'}));
    drawInbox();
    const rec=l.record||{};
    h+=`<div class="card" id="roomGo" style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><h2 style="margin:0 0 2px">Жарыс бөлмесі</h2>
      <p class="note" style="margin:0">Кодпен кір немесе өзің өткен кез келген станция бойынша аш — бәріне бір мезгілде бірдей есептер${rec.played?` · ${+rec.wins} жеңіс, ${+rec.played} жарыс${rec.stars?`, ★ ${+rec.stars}`:''}`:''}</p></div>
      <a class="btn gold" href="room/" style="white-space:nowrap">Бөлме</a></div>`;
    box.innerHTML=h; }).catch(()=>{});

  /* ── no class, no board — but say so, instead of leaving a hole ──────────────────────────
     A pupil whose class is empty cannot be ranked against classmates, so esep_board returns nothing and
     the card above never appears. Sixteen children were in that state on 2026-09-21 and saw only blank
     space. They may place themselves, once; moving between classes stays the teacher's. ── */
  if(!(student.klass||'').trim() && typeof Core._rpc==='function'){
    /* _rpc, not Core.call: Core.call prepends p_token, and esep_classes() takes no arguments — PostgREST
       then finds no function of that shape and answers PGRST202 instead of the list. The class names are
       not secret (the login card shows the same list before anyone is logged in). ── */
    Core._rpc('esep_classes',{}).then(list=>{ const box=document.getElementById('noclass');
      if(!box||!Array.isArray(list)||!list.length) return;
      box.innerHTML=`<div class="card"><h2 style="margin:0 0 2px">Сыныбың көрсетілмеген</h2>
        <p class="note" style="margin:0 0 10px">Сыныбыңды таңда — сонда сынып тақтасынан өз орныңды көресің.</p>
        <div class="row"><select class="big" id="myKl" style="flex:1"><option value="">Сынып…</option>${
          Core.klassOptions(list)}</select>
        <button class="btn" id="myKlGo" style="flex:none">Сақтау</button></div>
        <p class="note" id="myKlMsg" style="margin:8px 0 0"></p></div>`;
      document.getElementById('myKlGo').onclick=async()=>{
        const v=document.getElementById('myKl').value; if(!v) return;
        const msg=document.getElementById('myKlMsg'); msg.textContent='…';
        try{ const r=await Core.call('esep_my_class',{p_klass:v});
          if(r&&r.klass){ location.reload(); return; }
          msg.textContent=r&&r.error==='already'?'Сыныбың бұрын қойылған. Ауыстыру үшін мұғалімге айт.':'Болмады. Тағы көр.';
        }catch(e){ msg.textContent='Қосылу мүмкін болмады.'; } };
    }).catch(()=>{});
  }

  /* ── the class board (Core.board → esep_board). Shows: top five of MY class, my own place, and the per-pupil
     average of each class in my grade. The number is the pupil's STAR TOTAL — stage tests, challenges and rooms
     together — and `week` beside it is what was added since Monday. It never resets, so the board is also the
     one place where the purse in the header is authoritative; #starTot is corrected from it here.
     Nothing is drawn when offline, when the pupil has no class, or when nobody has a star yet. ── */
  Core.board().then(b=>{ const box=document.getElementById('board'); if(!box) return;
    if(!b||!b.klass||!b.me){ box.innerHTML=student.klass?'<div class="card"><p class="note" style="margin:0">Тақта әзірге бос: жұлдыз жинай баста!</p></div>':''; return; }
    { const mini=document.getElementById('rankmini'), me=b.me, up=(b.top||[]).find(x=>x.rank===me.rank-1);
      if(mini&&me.n&&me.rank) mini.innerHTML=`<a class="card rk" href="#synyp"><div class="rk-n"><b>${+me.rank}</b><small>орын</small></div>
        <div class="rk-m"><b>${me.rank===1?'Сен біріншісің!':up?`${esc(dat(String(up.name).split(' ')[0]))} дейін ${Math.max(1,up.n-me.n)} ★`:`${esc(b.klass)} тақтасы`}</b>
        <div class="rk-bar"><i style="width:${up&&up.n?Math.round(100*me.n/up.n):100}%"></i></div></div>${me.week>0?`<span class="rk-w">+${+me.week} апта</span>`:''}</a>`; }
    /* 06_stars.sql may not have been run yet: that board still counts this week's answers, not stars. It is
       told apart by `week`, which only the star version sends. Until then the purse keeps the route total it
       already has and the card keeps its old wording — a page that ships before the migration must not
       relabel someone's answer count as stars. */
    const stars=b.me.week!==undefined;
    const tot=document.getElementById('starTot'); if(stars&&tot&&b.me.n!=null&&tot.dataset.sure!=='1') tot.textContent=b.me.n;
    const top=b.top||[], cls=(b.classes||[]), max=Math.max(1,...cls.map(c=>c.avg));
    if(!top.length&&!cls.length) return;
    const wk=x=>stars&&x.week>0?`<small>осы аптада +${x.week}</small>`:'';
    const inTop=top.some(x=>x.me);
    const mine=`<div class="brd-row brd-me"><i>${b.me.n?b.me.rank:'–'}</i><span>Сен${wk(b.me)}</span><b>${b.me.n}</b></div>`;
    /* each pupil as the animal they chose (esep_board sends `ava` from 14_board_ava.sql on; before that, or for an
       animal outside the eight, the pupil's initial). My own animal comes from this device — always current. */
    const face=(x,size,head,mood)=>{ const a=x.me?Core.avatar():x.ava;
      return a&&window.Pets?Pets.svg(a,{size,head,mood}):`<span class="ini" style="width:${head?size:size*.8}px;height:${head?size:size*.8}px">${esc(String(x.me?student.name:x.name||'?').trim().charAt(0))}</span>`; };
    const pod=top.slice(0,3), POS=[1,0,2];
    const podium=pod.length?`<div class="pod">${POS.filter(i=>pod[i]).map((i,k)=>{ const x=pod[i];
      return `<div class="pod-c p${i+1}${x.me?' me':''}"><div class="pod-a" style="animation-delay:${k*.35}s">${face(x,i===0?64:54,false,i===0?'happy':'idle')}</div>
        <b class="pod-nm">${x.me?'Сен':esc(String(x.name).split(' ')[0])}</b><span class="pod-sc">★ ${+x.n}</span>
        <div class="pod-lid"></div><div class="pod-blk"><span>${+x.rank}</span></div></div>`; }).join('')}</div>`:'';
    const rows=top.slice(3).map(x=>`<div class="brd-row${x.me?' brd-me':''}"><i>${x.rank}</i>${face(x,30,true)}<span>${x.me?'Сен':esc(x.name)}${wk(x)}</span><b>${x.n}</b></div>`).join('');
    const mineRow=`<div class="brd-row brd-me"><i>${b.me.n?b.me.rank:'–'}</i>${face({me:true},30,true)}<span>Сен${wk(b.me)}</span><b>${b.me.n}</b></div>`;
    const tabMine=(top.length?podium+rows:`<p class="note">${stars?'Әзірге ешкім жұлдыз жинаған жоқ.':'Бұл аптада әлі ешкім ұпай жинаған жоқ.'} Бірінші бол!</p>`)+(inTop?'':mineRow);
    const tabCls=cls.length>1?cls.map(c=>`<div class="brd-row" style="border:0;padding:0"><span>${esc(c.klass)}${c.mine?' · сенің сыныбың':''}</span><b>${c.avg}</b></div><div class="brd-bar"><b class="${c.mine?'mine':''}" style="width:${Math.round(100*c.avg/max)}%"></b></div>`).join('')
      +`<p class="note" style="margin:0">Бір оқушыға шаққандағы орташа${stars?' жұлдыз':''}. Сенің ${b.me.n} ${stars?'жұлдызың':'есебің'} ${esc(b.klass)} нәтижесіне қосылды.</p>`:'';
    let tab='mine';
    const draw=()=>{ box.innerHTML=`<div class="card"><div class="rt-head" style="padding:0"><h2 style="margin:0">Сынып тақтасы · ${esc(b.klass)}</h2><span class="note">${stars?'★ жұлдыз':'осы апта'}</span></div>
      ${tabCls?`<div class="brd-tabs"><button type="button" data-t="mine" aria-pressed="${tab==='mine'}">Менің сыныбым</button><button type="button" data-t="cls" aria-pressed="${tab==='cls'}">Сыныптар</button></div>`:'<div style="height:8px"></div>'}
      ${tab==='mine'?`<p class="note" style="margin:0 0 4px">${stars?'Кезең тесті, жарыс және бөлме — бәрі қосылады':'Кеңессіз, бірінші реттен дұрыс шешілген есептер'}</p>${tabMine}`:tabCls}
      <details class="rules"><summary>Жұлдыз қалай жиналады?</summary><p class="note" style="margin:8px 0 0">${stars?'Жұлдыз: кеңессіз, бірден дұрыс 5 есеп — 1 · бүгінгі мақсат — 1 · кезең тесті 10/10 — 3, 9/10 — 2, 8/10 — 1 · жарыс пен бөлме — 3/2/1. Жиналған жұлдыз ешқашан жоғалмайды.':'Дүйсенбі күні тақта нөлден басталады.'}</p></details></div>`;
      box.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ tab=x.dataset.t; draw(); }); };
    draw(); });
})();
</script>
</body>
</html>
