<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* the printable class report (printReport): on paper only the report, no bar, no buttons, no card frames */
table.prt td:first-child{white-space:nowrap} table.prt td:nth-child(4){min-width:200px}
.pex td{font-weight:600;background:var(--bg,#faf8f3)!important;border-top:0}
.pex ol{margin:2px 0 0 22px;padding:0} .pex li{margin:2px 0}
.pex .fig{max-width:280px;margin:4px 0} .pex .fig svg{max-width:100%;height:auto}
.pex .expr{font-family:var(--disp);display:inline-block;vertical-align:middle;font-size:.7em}
@page{margin:12mm}
@media print{ .top,.noprint{display:none!important} body{background:#fff;color:#000} .app{max-width:none;padding:0;margin:0}
  .card{border:0;border-radius:0;padding:0 0 14px;margin:0;background:#fff;box-shadow:none} table.t3 th,table.t3 td{padding:4px 6px;font-size:.8rem;background:#fff}
  tr.phead,tr.pex{break-inside:avoid} h1{font-size:1.4rem} }

<body>
<div id="app" class="app wide"></div>
<script src="../core/core.js?v=13"></script>
<script src="../core/figs.js?v=8"></script>
<script src="../room/routes.js?v=1"></script>
<script>
/* Teacher dashboard across routes. Everything goes through the esep_t_* functions (supabase/01_additive.sql):
   the secret is checked ON THE SERVER and answers with a 12-hour token; without it the functions return nothing.
   Every value that comes from the database is escaped before it touches innerHTML — pupils write those rows. */
'use strict';
const rpc=Core._rpc, esc=Core.esc, $=id=>document.getElementById(id), enc=encodeURIComponent;
const ROUTES=Core.config.ROUTES.map(r=>r[0]); const ROUTE_NAME=Object.fromEntries(Core.config.ROUTES.map(r=>[r[0],r[1]]));
let T={rows:[],klass:'',route:'ALL',tok:sessionStorage.getItem('esep_tt')||'',crange:null,range:null,app:$('app')};
const pad2=n=>String(n).padStart(2,'0'); const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fmtDT=iso=>{ const d=new Date(iso); return !iso||isNaN(d)?'—':d.toLocaleString('kk-KZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); };
function rangePreset(k){ const now=new Date(); const to=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); let from;
  if(k==='today') from=new Date(to.getTime()-864e5); else if(k==='yest'){ from=new Date(to.getTime()-2*864e5); to.setTime(to.getTime()-864e5); }
  else if(k==='7') from=new Date(to.getTime()-7*864e5); else if(k==='30') from=new Date(to.getTime()-30*864e5); else return {from:'',to:''};
  return {from:ymd(from),to:ymd(new Date(to.getTime()-864e5))}; }
async function trpc(fn,args){ try{ return await rpc(fn,Object.assign({p_token:T.tok},args||{})); }
  catch(e){ if(/teacher session required/.test(e.message)){ T.tok=''; sessionStorage.removeItem('esep_tt'); login('Сессия аяқталды. Қайта кіріңіз.'); throw new Error('сессия аяқталды'); } throw e; } }
function rangeISO(r){ return {p_from:r.from?new Date(r.from+'T00:00:00').toISOString():null, p_to:r.to?new Date(new Date(r.to+'T00:00:00').getTime()+864e5).toISOString():null}; }
/* A pupil writes their own `state`, so nothing in it can be trusted to have the right TYPE: a counter may arrive as
   a string of HTML, a stage as null. num() and clean() make every value safe before it is added up or shown. */
const num=v=>{ v=Number(v); return Number.isFinite(v)?v:0; };
function clean(rs){ if(!rs||typeof rs!=='object'||Array.isArray(rs)) return {};
  const st={}; if(rs.stages&&typeof rs.stages==='object'&&!Array.isArray(rs.stages)) Object.keys(rs.stages).forEach(k=>{ const v=rs.stages[k]; if(v&&typeof v==='object') st[k]=Object.assign({},v,{level:num(v.level),streak:num(v.streak),status:String(v.status||''),tests:Array.isArray(v.tests)?v.tests:[]}); });
  return Object.assign({},rs,{stages:st,nAns:num(rs.nAns),nOk:num(rs.nOk),nHint:num(rs.nHint),diag:rs.diag&&typeof rs.diag==='object'?rs.diag:null}); }
/* route state of a student row (legacy WP state lived at top level) */
const RS=(r,route)=>{ const s=(r.state&&typeof r.state==='object')?r.state:{}; if(s[route]) return clean(s[route]); if(route==='WP'&&s.stages) return clean(s); return {}; };
const stOf=(r,route)=>{ const st=RS(r,route).stages||{}; return Object.keys(st).find(k=>st[k].status==='current')||null; };
const evRoute=e=>e.route||'WP';
/* «барлық бағыт» — one row per pupil across every route, and the default view.
   Added because a pupil who had simply never opened the selected route looked exactly like a pupil
   whose diagnostic was missing: both said «диагн. жоқ · 0 есеп». Now «жоқ» means no data at all. */
const ALL='ALL';
const isAll=()=>T.route===ALL;
const hasData=(r,c)=>Object.keys(RS(r,c)).length>0;
const routesOf=r=>ROUTES.filter(c=>hasData(r,c));
function agg(r){ const rs=routesOf(r); let a=0,ok=0,h=0; const cur=[];
  rs.forEach(c=>{ const s=RS(r,c); a+=s.nAns||0; ok+=s.nOk||0; h+=s.nHint||0; const st=stOf(r,c); if(st) cur.push([c,st]); });
  return {rs,a,ok,h,cur}; }
const mainRoute=r=>routesOf(r).sort((x,y)=>(RS(r,y).nAns||0)-(RS(r,x).nAns||0))[0]||ROUTES[0];
/* A stage id alone («AR-03») says nothing to a parent or to a colleague, so wherever a stage is shown it carries the
   name from the route's own stage table (room/routes.js reads it; PV has no such table yet and stays a bare id).
   The id comes from the pupil's own state, so it is looked up with hasOwnProperty — never as a plain property. */
const RNM={}; const roomNames=async r=>{ if(RNM[r]) return RNM[r]; if(!window.RoomRoutes) return {}; try{ RNM[r]=await RoomRoutes.stageNames(r); }catch(e){ return {}; } return RNM[r]; };   // a failed download is not remembered
const loadNames=()=>Promise.all(ROUTES.map(roomNames));
const stInfo=(route,id)=>{ const t=RNM[route]; return t&&Object.prototype.hasOwnProperty.call(t,String(id))?t[id]:null; };
const nmOf=(route,id)=>{ const i=stInfo(route,id); return i?String(i.name||''):''; };
const stHTML=(route,id)=>{ const n=nmOf(route,id); return esc(id)+(n?` <small class="muted" style="font-weight:600">${esc(n)}</small>`:''); };
function stageCell(r,c){ if(!hasData(r,c)) return '<span class="muted">жоқ</span>';
  const st=stOf(r,c); return st?stHTML(c,st):esc(RS(r,c).diag?'—':'диагн. жоқ'); }   // stage keys are written by the pupil's browser
let SR=null;   // the route the open student card is showing (in «барлығы» it is picked per pupil)
function verdict(n,acc,h){ if(!n||n<5) return ['—','var(--muted)']; if(acc>=0.8&&h<1) return ['Меңгерді','var(--good)']; if(acc>=0.7&&h>=2) return ['Кеңеспен','var(--gold)']; if(acc<0.5&&h<1) return ['Болжайды','var(--bad)']; if(acc<0.6&&h>=2) return ['Қиналады','var(--bad)']; return ['Үйреніп жатыр','var(--accent)']; }
const vcell=(n,acc,h)=>{ const [t,c]=verdict(n,acc,h); return `<td style="color:${c};font-weight:800;white-space:nowrap">${t}</td>`; };
const VLEGEND='Қорытынды: <b>Меңгерді</b> — дұрыс ≥80%, кеңес &lt;1 · <b>Кеңеспен</b> — дұрыс, бірақ кеңес ≥2 · <b>Болжайды</b> — дұрыс &lt;50%, кеңесті қолданбайды · <b>Қиналады</b> — дұрыс &lt;60%, кеңес ≥2 · <b>Үйреніп жатыр</b> — аралық · «—» 5 есептен аз.';
function tbar(sub){ return `<div class="top"><div class="brand">Есеп жолы<small>Мұғалім беті · ${esc(sub||'барлық бағыт')}</small></div><span><a href="../" class="muted">портал</a>${T&&T.tok?' · <a href="#" class="muted" onclick="tlogout();return false">шығу</a>':''}</span></div>`; }
async function tlogout(){ clearTimeout(T.rpoll); T.view=(T.view||0)+1; const t=T.tok; T.tok=''; sessionStorage.removeItem('esep_tt'); try{ await rpc('esep_t_logout',{p_token:t}); }catch(e){} login(); }
function login(note){ T.app.innerHTML=tbar('кіру')+`<div class="card"><h2>Мұғалімнің құпия сөзі</h2><input class="big" id="tpin" type="password" placeholder="Құпия сөз" autocomplete="current-password"><div style="height:10px"></div><button class="btn wide" id="tgo">Кіру</button><p class="note" id="pinMsg" style="margin-top:8px">${esc(note||'')}</p></div>`;
  const go=async()=>{ const v=($('tpin').value||'').trim(); if(!v) return; $('tgo').disabled=true; $('pinMsg').textContent='Тексерілуде…';
    try{ const r=await rpc('esep_t_login',{p_secret:v});
      if(r&&r.token){ T.tok=r.token; sessionStorage.setItem('esep_tt',r.token); return showTeacher(); }
      $('pinMsg').textContent=r&&r.error==='locked'?'Тым көп қате әрекет. 10 минуттан кейін қайталаңыз.':r&&r.error==='not_configured'?'Құпия сөз әлі орнатылмаған (supabase/README).':'Құпия сөз дұрыс емес.'; }
    catch(e){ $('pinMsg').textContent='Базаға қосылу мүмкін болмады.'; }
    $('tgo').disabled=false; };
  $('tgo').onclick=go; $('tpin').onkeydown=e=>{ if(e.key==='Enter') go(); }; setTimeout(()=>$('tpin').focus(),50); }

async function showTeacher(){ clearTimeout(T.rpoll); T.view=(T.view||0)+1; const gen=T.view;
  if(!T.tok) return login();
  if(!T.crange) T.crange=rangePreset('today');
  T.app.innerHTML=tbar()+`<div class="card"><p>Жүктелуде…</p></div>`;
  try{ T.rows=((await trpc('esep_t_students'))||[]).filter(r=>r&&/^[0-9a-f-]{1,40}$/i.test(String(r.id))).map(r=>Object.assign(r,{time_ms:num(r.time_ms),name:String(r.name??''),klass:String(r.klass??'')})); }
  catch(e){ if(!T.tok) return; T.app.innerHTML=tbar()+`<div class="card"><p>Базаға қосылу мүмкін болмады.</p><p class="note">${esc(e.message)}</p><button class="btn" onclick="showTeacher()">Қайталау</button></div>`; return; }
  await loadNames(); if(gen!==T.view||!T.tok) return;   // stage names for the table (static files; a miss just leaves bare ids)
  const classes=[...new Set(T.rows.map(r=>r.klass||'—'))].sort(); const rows=T.rows.filter(r=>!T.klass||(r.klass||'—')===T.klass); const route=T.route;
  const tot={n:rows.length,min:rows.reduce((a,r)=>a+(r.time_ms||0),0)/60000,
             ans:rows.reduce((a,r)=>a+(isAll()?agg(r).a:(RS(r,route).nAns||0)),0)};
  const rlabel=isAll()?'барлық бағыт':ROUTE_NAME[route];
  let html=tbar(rlabel)+`<div class="card" id="roomEntry" style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><h2 style="margin:0 0 2px">Жарыс бөлмесі</h2><p class="note" style="margin:0">Кез келген станцияны таңдаңыз, кодты тақтаға шығарыңыз — бүкіл сынып бір мезгілде бірдей есептерді шығарады.</p></div><button class="btn gold" onclick="showRooms()" style="white-space:nowrap">Ашу</button></div>
  <div class="card"><div class="qbar"><span><b>${tot.n}</b> оқушы · <b>${Math.round(tot.min)}</b> мин · <b>${tot.ans}</b> есеп (${isAll()?'барлығы':route})</span>
    <span>Бағыт: <select onchange="T.route=this.value;showTeacher()"><option ${isAll()?'selected':''} value="${ALL}">барлық бағыт</option>${ROUTES.map(c=>`<option ${c===route?'selected':''} value="${c}">${c} ${esc(ROUTE_NAME[c])}</option>`).join('')}</select>
    &nbsp; Сынып: <select onchange="T.klass=this.value;showTeacher()"><option value="">барлығы</option>${classes.map(c=>`<option ${c===T.klass?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></span></div>
    <div style="overflow-x:auto"><table class="t3"><tr><th>Оқушы</th><th>Сынып</th><th>${isAll()?'Кезеңдер':'Кезең'}</th><th>${isAll()?'Бағыт':'Деңгей'}</th><th>Мин</th><th>Есеп</th><th>Дұрыс</th><th>Кеңес ⌀</th><th>Қорытынды</th><th>Соңғы кіру</th></tr>
    ${rows.map(r=>{ try{ const stale=Date.now()-new Date(r.last_seen).getTime()>7*864e5; let cStage,cLvl,a,ok,h;
      if(isAll()){ const g=agg(r); a=g.a; ok=g.ok; h=g.h;
        cStage=g.cur.map(([c,st])=>stHTML(c,st)).join('<br>')||(g.rs.length?'—':'<span class="muted">жұмыс істемеген</span>'); cLvl=g.rs.join(' ')||'—'; }
      else { const s=RS(r,route); const cur=stOf(r,route); a=s.nAns||0; ok=s.nOk||0; h=s.nHint||0;
        cStage=stageCell(r,route); cLvl=cur?s.stages[cur].level:'—'; }
      return `<tr style="cursor:pointer" onclick="showStudent('${r.id}')"><td style="text-align:left"><b>${esc(r.name)}</b></td><td>${esc(r.klass||'—')}</td><td>${cStage}</td><td>${esc(cLvl)}</td><td>${Math.round((r.time_ms||0)/60000)}</td><td>${a}</td><td>${a?Math.round(100*ok/a)+'%':'—'}</td><td>${a?(h/a).toFixed(1):'—'}</td>${vcell(a,a?ok/a:0,a?h/a:0)}<td style="${stale?'color:var(--bad)':''}">${fmtDT(r.last_seen)}</td></tr>`; }catch(e){ return `<tr><td style="text-align:left"><b>${esc(r.name)}</b></td><td colspan="9" class="muted">бұл жолды көрсету мүмкін болмады</td></tr>`; } }).join('')}
    ${rows.length?'':'<tr><td colspan="10">Әлі оқушы жоқ</td></tr>'}</table></div>
    <p class="note" style="margin-top:10px">${isAll()?'«жұмыс істемеген» — бұл оқушының ешқандай бағытта деректері жоқ. Бір бағытты таңдасаң, «жоқ» — сол бағытқа кірмеген, «диагн. жоқ» — кірген, бірақ диагностика өтпеген. ':''}${VLEGEND} Оқушыға басу — толық есеп. <a href="#" onclick="printReport();return false">Басып шығару</a> (кезең атаулары мен мысал есептермен) · <a href="#" onclick="exportCSV();return false">CSV жүктеу (Excel)</a> · <a href="#" onclick="showTeacher();return false">жаңарту</a></p></div>`;
  if(isAll()){ const d={}; let none=0;
    rows.forEach(r=>{ const rs=routesOf(r); if(!rs.length){ none++; return; } rs.forEach(c=>d[c]=(d[c]||0)+1); });
    html+=`<div class="card"><h2>Бағыт бойынша: неше оқушының деректері бар</h2><div class="kv">${ROUTES.filter(c=>d[c]).map(c=>`<span>${c} ${esc(ROUTE_NAME[c])}</span><span>${d[c]}</span>`).join('')}${none?`<span>Ешқандай бағытта жұмыс істемеген</span><span>${none}</span>`:''}</div></div>`;
  } else {
    const dist={}; rows.forEach(r=>{ const c=stOf(r,route)||(hasData(r,route)?'—':'жоқ'); dist[c]=(dist[c]||0)+1; });
    html+=`<div class="card"><h2>Кезең бойынша бөлінуі · ${route}</h2><div class="kv">${Object.keys(dist).sort().map(k=>`<span>${k==='—'?'Диагностика өтпеген':k==='жоқ'?'Бұл бағытқа кірмеген':esc(k)}</span><span>${dist[k]}</span>`).join('')}</div></div>`;
  }
  html+=`<div class="card" id="clsCard"></div>`;   // the class list: filled after the first paint, like the board
  html+=`<div class="card" id="dayCard"><h2>Күн бойынша: ${esc(T.klass||'барлық сынып')} · ${isAll()?'барлық бағыт':route}</h2>
    <div class="row" style="margin-bottom:8px"><input type="date" id="cfrom" value="${esc(T.crange.from)}" class="big" style="font-size:1rem;padding:8px;flex:1"><input type="date" id="cto" value="${esc(T.crange.to)}" class="big" style="font-size:1rem;padding:8px;flex:1"><button class="btn ghost" onclick="T.crange={from:$('cfrom').value,to:$('cto').value};showTeacher()">Көрсету</button></div>
    <div class="row" style="margin-bottom:12px">${[['today','Бүгін'],['yest','Кеше'],['7','7 күн'],['30','30 күн']].map(([k,l])=>`<button class="btn plain" style="min-height:36px;padding:6px 10px" onclick="T.crange=rangePreset('${k}');showTeacher()">${l}</button>`).join('')}</div>
    <div id="dayBody"><p class="note">Жүктелуде…</p></div></div>`;
  T.app.innerHTML=html; renderClassDay(rows); renderClasses();
}
/* ── the class list ──────────────────────────────────────────────────────────────────────
   A class used to be a free-text box, so one class arrived as «5», «5 БАРЫС», «БАРЫС5» and
   «5БАРЫС» — four classes to the server, and a board of one pupil each. Pupils now pick from
   this list; it is the teacher who keeps it, and MERGE is the tool that repairs the old mess:
   it moves every pupil of one spelling into another and removes the spelling for good. ── */
async function renderClasses(){
  const box=$('clsCard'); if(!box) return;
  let list=[]; try{ list=await trpc('esep_t_classes'); }catch(e){
    box.innerHTML=`<h2>Сыныптар</h2><p class="note">Бұл мүмкіндік әлі орнатылмаған (supabase/08_classes.sql).</p>`; return; }
  T.classes=list;
  const stray=list.filter(c=>!c.listed);
  /* Grouped by year, because the same class name lives in two years here — Samuryq and Qyran exist in both
     grade 2 and grade 3. The grade is part of the name («2 SAMURYQ»), so the two are different classes to the
     server; grouping is what makes that visible instead of looking like a duplicate. A class with no grade
     (an old free-text one) is gathered under «деңгейсіз» — it also gets no class board, so it wants fixing. */
  const grades=[...new Set(list.map(c=>c.grade==null?null:+c.grade))].sort((a,b)=>(a==null?99:a)-(b==null?99:b));
  const row=c=>`<tr><td style="text-align:left"><b>${esc(c.name)}</b>${c.listed?'':' <span class="chip">тізімде жоқ</span>'}</td><td>${+c.pupils}</td>
      <td style="white-space:nowrap">${c.pupils?`<select data-merge="${esc(c.name)}" style="font-size:.85rem"><option value="">біріктіру →</option>${
        list.filter(x=>x.listed&&x.name!==c.name).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select>`
        :`<a href="#" data-del="${esc(c.name)}">өшіру</a>`}</td></tr>`;
  box.innerHTML=`<div class="rt-head" style="padding:0"><h2 style="margin:0">Сыныптар</h2><span class="note">оқушы тек тізімнен таңдайды</span></div>
    <div style="overflow-x:auto"><table class="t3" style="margin-top:8px"><tr><th style="text-align:left">Сынып</th><th>Оқушы</th><th></th></tr>
    ${grades.map(g=>{ const cs=list.filter(c=>(c.grade==null?null:+c.grade)===g);
      return `<tr><td colspan="3" style="text-align:left;background:var(--bg2,#f3f0e8);font-weight:600">${g==null?'деңгейсіз':g+'-сынып'} · ${cs.length} сынып · ${cs.reduce((s,c)=>s+ +c.pupils,0)} оқушы</td></tr>`
        + cs.map(row).join(''); }).join('')}
    </table></div>
    <p class="note" style="margin-top:10px">Жаңа сынып:
      <select id="clsGr" class="big" style="width:110px;display:inline-block;font-size:1rem;padding:8px"><option value="">деңгей…</option>${
        [1,2,3,4,5].map(g=>`<option value="${g}">${g}-сынып</option>`).join('')}</select>
      <input class="big" id="clsNew" placeholder="Samuryq" style="width:130px;display:inline-block;font-size:1rem;padding:8px">
      <button class="btn ghost" id="clsAdd">Қосу</button></p>
    <p class="note">Деңгейді таңдасаң, аты «2 SAMURYQ» болып сақталады — сынып атының алдындағы сан оның деңгейі.
      Ол сан болмаса, сынып тақтасы қай сыныптармен салыстыруды білмейді.
      Бұрыннан бар сынып<b>тың атын өзгертпе</b>: жаңасын қосып, ескісін соған <b>біріктір</b> — оқушылар бірге көшеді.</p>

  const exHTML=(c,id)=>{ const qs=EX[c+' '+id]; const i=stInfo(c,id);
    if(qs&&qs.length) return `<ol>${qs.map(q=>{ let f=''; try{ f=RoomRoutes.figHTML(MOD[c],q); }catch(e){ f=''; }
      return `<li>${qHTML(q)}${f?`<div class="fig">${f}</div>`:''} <span class="muted">→</span> <b>${aHTML(q)}</b>${q.kind==='choice'&&q.choices.length?` <span class="muted">(нұсқалар: ${q.choices.map(x=>esc(x)).join(' · ')})</span>`:''}</li>`; }).join('')}</ol>`;
    if(qs&&i&&i.type==='speed') return '<span class="note">⚡ уақытқа жаттығу — мысал берілмейді</span>';
    return ''; };
  const stCell=(c,id)=>{ const i=stInfo(c,id); return `<b>${esc(id)}</b>${i?' — '+esc(i.name)+(i.grade?` <span class="muted">· ${esc(i.grade)}-сынып</span>`:''):' <span class="muted">(атауы жоқ)</span>'}`; };
  const line=(r,c)=>{ const s=RS(r,c); const cur=stOf(r,c); const a=s.nAns||0; const ex=cur?exHTML(c,cur):'';
    return `<tr class="${ex?'phead':''}"><td style="text-align:left"><b>${esc(r.name)}</b></td><td>${esc(r.klass||'—')}</td><td>${c}</td><td style="text-align:left">${cur?stCell(c,cur):'<span class="muted">'+(s.diag?'—':'диагн. жоқ')+'</span>'}</td><td>${cur?esc(s.stages[cur].level):'—'}</td><td>${a}</td><td>${a?Math.round(100*(s.nOk||0)/a)+'%':'—'}</td>${vcell(a,a?(s.nOk||0)/a:0,a?(s.nHint||0)/a:0)}</tr>`
      +(ex?`<tr class="pex"><td colspan="8" style="text-align:left"><span class="muted">Мысал есептер · ${esc(cur)}:</span>${ex}</td></tr>`:''); };
  const trs=rows.map(r=>{ const rs=isAll()?routesOf(r):[route]; if(!rs.length) return `<tr><td style="text-align:left"><b>${esc(r.name)}</b></td><td>${esc(r.klass||'—')}</td><td colspan="6" class="muted">жұмыс істемеген</td></tr>`; return rs.map(c=>line(r,c)).join(''); }).join('');
  T.app.innerHTML=tbar('басып шығару')+`<div class="card noprint"><div class="qbar"><a href="#" onclick="showTeacher();return false">← тізім</a>
      <span>Мысал есептер: <select onchange="T.pk=+this.value;printReport()">${PK_OPTS.map(([k,l])=>`<option value="${k}" ${k===K?'selected':''}>${l}</option>`).join('')}</select> &nbsp; <button class="btn gold" onclick="window.print()">Басып шығару</button></span></div>
      <p class="note" style="margin:8px 0 0">Қағазға шығарғанда тек төмендегі кесте шығады. Әр оқушының кезеңінен кейін — оның атауы; мысал есептер — әр бағыттың ең жоғарғы кезеңдерінде тұрған оқушыларға, кезең тестінің деңгейінде (3-деңгей). Бір кезеңдегі оқушыларға бірдей есептер; қайта шығарғанда да сол есептер.</p></div>
    <div class="card"><h1>Есеп жолы · ${esc(T.klass||'барлық сынып')}</h1><p class="note">${esc(isAll()?'барлық бағыт':route+' · '+(ROUTE_NAME[route]||''))} · ${ymd(new Date())} · ${rows.length} оқушы</p>
      <div style="overflow-x:auto"><table class="t3 prt"><tr><th>Оқушы</th><th>Сынып</th><th>Бағыт</th><th>Кезең</th><th>Деңгей</th><th>Есеп</th><th>Дұрыс</th><th>Қорытынды</th></tr>${trs||'<tr><td colspan="8">Оқушы жоқ</td></tr>'}</table></div>
      <p class="note" style="margin-top:8px">${VLEGEND}</p></div>`;
}
/* ── challenge rooms (supabase/05_rooms.sql). The teacher opens a room on ANY station of AR / FR / TE / WP, shows the
      code on the board, starts the race and — unlike the pupils, who see the top three and their own place — gets the
      whole ranking, every answer, and the questions the class missed. Station names come from the routes' own tables. ── */
const stName=x=>{ const n=(RNM[x.route]||{})[x.stage]; return x.stage+(n?' · '+n.name:''); };
const RWHY={alone:'Кемінде екі ойыншы керек.',too_many:'Ашық бөлме тым көп — біреуін жабыңыз.',busy:'Бос код табылмады, қайталаңыз.',stage:'Бұл станция бойынша жарыс өткізуге болмайды.',thin:'Бұл станцияда жарысқа есеп жеткіліксіз.',not_found:'Бөлме табылмады.'};
const mmss=ms=>{ const x=Math.max(0,Math.round(num(ms)/1000)); return Math.floor(x/60)+':'+pad2(x%60); };
async function showRooms(msg){ clearTimeout(T.rpoll); T.view=(T.view||0)+1; T.rarm=false; if(!T.tok) return login(); const gen0=T.view;
  T.app.innerHTML=tbar('жарыс бөлмесі')+`<div class="card"><p>Жүктелуде…</p></div>`;
  let list; try{ list=(await trpc('esep_t_rooms'))||[]; }
  catch(e){ if(!T.tok) return; T.app.innerHTML=tbar('жарыс бөлмесі')+`<div class="card"><div class="qbar"><a href="#" onclick="showTeacher();return false">← тізім</a></div><h2>Жарыс бөлмесі әлі орнатылмаған</h2><p class="note">Supabase SQL editor-да <b>supabase/05_rooms.sql</b> файлын бір рет іске қосыңыз. (${esc(e.message)})</p></div>`; return; }
  const classes=[...new Set(T.rows.map(r=>(r.klass||'').trim().toUpperCase()).filter(Boolean))].sort();
  const RRS=window.RoomRoutes?RoomRoutes.ROUTES:[]; await Promise.all(RRS.map(roomNames)); if(gen0!==T.view||!T.tok) return;   // «шығу» or another view while this was loading
  if(!RRS.length){ T.app.innerHTML=tbar('жарыс бөлмесі')+`<div class="card"><div class="qbar"><a href="#" onclick="showTeacher();return false">← тізім</a></div><h2>Бет толық жүктелмеді</h2><p class="note">room/routes.js жүктелмеді — бетті қайта ашыңыз.</p></div>`; return; }
  if(!RRS.includes(T.rroute)) T.rroute=RRS.includes(T.route)?T.route:RRS[0];
  const stOpts=r=>Object.keys(RNM[r]||{}).filter(k=>RoomRoutes.usable(r,RNM[r][k].type)).map(k=>`<option value="${esc(k)}">${esc(k+' · '+RNM[r][k].name)}${RNM[r][k].grade?' ('+esc(RNM[r][k].grade)+'-сын.)':''}</option>`).join('');
  const live=list.filter(x=>x.status!=='done'), done=list.filter(x=>x.status==='done');
  const row=x=>`<tr style="cursor:pointer" onclick="showRoom(${num(x.id)})"><td style="text-align:left"><b>${esc(x.by_teacher?'Мұғалім':x.host_name)}</b></td><td style="text-align:left">${esc(stName(x))}</td><td>${esc(x.klass||'—')}</td><td>${x.status==='done'?'':'<b>'+esc(x.code)+'</b>'}</td><td>${num(x.n)}</td><td>${x.status==='lobby'?'күтіп тұр':x.status==='running'?'жүріп жатыр':'аяқталды'}</td><td>${esc(fmtDT(x.t))}</td></tr>`;
  T.app.innerHTML=tbar('жарыс бөлмесі')+`<div class="card"><div class="qbar"><a href="#" onclick="showTeacher();return false">← тізім</a></div><h2>Жаңа бөлме</h2>
    <div class="row" style="margin-bottom:8px;align-items:center;flex-wrap:wrap"><span>Бағыт: <select id="rroute">${RRS.map(r=>`<option ${r===T.rroute?'selected':''} value="${r}">${r} ${esc(ROUTE_NAME[r]||'')}</option>`).join('')}</select></span>
      <span style="flex:1;min-width:220px">Станция: <select id="rstage" style="max-width:100%">${stOpts(T.rroute)}</select></span>
      <span>Сынып: <select id="rkl"><option value="">тек кодпен</option>${classes.map(c=>`<option ${c===(T.klass||'').trim().toUpperCase()?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></span></div>
    <p class="note" style="margin:0 0 10px">Кез келген станцияны таңдауға болады (оқушылар тек өздері өткен станция бойынша аша алады). Сынып таңдалса, бөлме сол сыныптағы оқушылардың басты бетінде өзі шығады. Басқалары кодпен кіреді. Оқушылар тек үздік үштікті және өз орнын көреді; толық тізім тек осы бетте.</p>
    <button class="btn gold" id="rnew">Бөлме ашу</button> <span class="note" id="rmsg" style="color:var(--bad)">${esc(msg||'')}</span></div>
    ${live.length?`<div class="card"><h2>Қазір ашық</h2><div style="overflow-x:auto"><table class="t3"><tr><th>Ашқан</th><th>Станция</th><th>Сынып</th><th>Код</th><th>Ойыншы</th><th>Күйі</th><th>Уақыты</th></tr>${live.map(row).join('')}</table></div></div>`:''}
    ${done.length?`<div class="card"><h2>Соңғы жарыстар</h2><div style="overflow-x:auto"><table class="t3"><tr><th>Ашқан</th><th>Станция</th><th>Сынып</th><th></th><th>Ойыншы</th><th>Күйі</th><th>Уақыты</th></tr>${done.map(row).join('')}</table></div><p class="note" style="margin-top:8px">Жолға басу — толық нәтиже.</p></div>`:''}`;
  $('rroute').onchange=()=>{ T.rroute=$('rroute').value; $('rstage').innerHTML=stOpts(T.rroute); };
  $('rnew').onclick=async()=>{ $('rnew').disabled=true; const route=$('rroute').value, stage=$('rstage').value, ru=RoomRoutes.rule(route,(RNM[route][stage]||{}).type); let r;
    /* try the generator first: a station that cannot fill a sheet must not leave a class waiting */
    try{ const mod=await RoomRoutes.load(route); if(RoomRoutes.sheet(mod,route,stage,1,ru.n).length<3) r={error:'thin'}; }catch(e){ r={error:'Байланыс жоқ'}; }
    if(!r){ try{ r=await trpc('esep_t_room_create',{p_route:route,p_stage:stage,p_klass:$('rkl').value,p_n:ru.n,p_secs:ru.secs}); }catch(e){ r={error:e.message}; } }
    if(!r||r.error){ $('rmsg').textContent=RWHY[r&&r.error]||('Қате: '+((r&&r.error)||'')); $('rnew').disabled=false; return; } showRoom(num(r.id)); }; }
async function showRoom(id,keep){ clearTimeout(T.rpoll); if(!T.tok) return login(); if(!keep){ T.view=(T.view||0)+1; T.rkey=''; T.rarm=false; } const gen=T.view;
  let s; try{ s=await trpc('esep_t_room_state',{p_id:id}); }catch(e){ if(!T.tok||gen!==T.view) return; T.rpoll=setTimeout(()=>showRoom(id,true),3000); return; }
  if(gen!==T.view||!T.tok) return;   // «← тізім» or «шығу» was pressed while this reply was on its way
  if(!s||s.error) return showRooms(RWHY[s&&s.error]||'Бөлме табылмады.');
  await roomNames(s.route); if(gen!==T.view||!T.tok) return;
  /* a finished race: rebuild the sheet HERE from the room's seed. The questions and answers shown below are the teacher
     page's own; from the pupils come only what they typed and right/wrong, matched by position. A pupil whose device
     reported another sheet fingerprint is flagged and shown with his own browser's words, marked as such. */
  let QS=null, MYP=''; if(s.status==='done'&&!s.cancelled&&s.seed&&window.RoomRoutes){ try{ const mod=await RoomRoutes.load(s.route); QS=RoomRoutes.sheet(mod,s.route,s.stage,s.seed,s.n_items); MYP=RoomRoutes.print(QS); }catch(e){ QS=null; } if(gen!==T.view||!T.tok) return; }
  const qHTML=q=>esc(q.stem)+(q.exprHTML?` <span style="display:inline-block;vertical-align:middle;font-family:var(--disp)">${q.exprHTML}</span>`:''), aHTML=q=>q.ansHTML||esc(q.ans);
  const key=JSON.stringify(Object.assign({},s,{left:0,starts_in:0})); const head=`<div class="qbar"><a href="#" onclick="showRooms();return false">← бөлмелер</a><span class="chip">${esc(s.klass||'тек кодпен')}</span></div>`;
  if(key!==T.rkey||!$('roomView')){ T.rkey=key; let h=tbar('жарыс бөлмесі')+`<div id="roomView">`;
    if(s.status==='lobby') h+=`<div class="card" style="text-align:center">${head}<p class="note" style="margin:8px 0 0;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Бөлме коды</p>
        <div style="font-family:var(--disp);font-weight:600;font-size:clamp(4rem,18vw,9rem);letter-spacing:.14em;padding-left:.14em;line-height:1.1;font-variant-numeric:tabular-nums">${esc(s.code)}</div>
        <h2 style="margin:0">${esc(stName(s))}</h2><p class="note" style="margin:4px 0 0">${num(s.n_items)} есеп · ${Math.round(num(s.secs)/60)} минут · оқушылар: басты бет → «Жарыс бөлмесі» → «Кодпен кіру»</p></div>
      <div class="card"><h2 style="margin:0 0 8px">Ойыншылар · ${s.players.length}</h2><p style="margin:0;line-height:2">${s.players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join(' ')||'<span class="note">Әзірге ешкім кірген жоқ.</span>'}</p></div>
      ${s.by_teacher?`<button class="btn gold" id="rstart" ${s.players.length<2?'disabled':''}>Бастау</button> <button class="btn plain" id="rclose">Бөлмені жабу</button> <span class="note" id="rmsg2">${s.players.length<2?'Кемінде екі ойыншы керек.':'Басталғаннан кейін ешкім кіре алмайды.'}</span>`:`<button class="btn plain" id="rclose">Бөлмені жабу</button> <span class="note">Бұл бөлмені оқушы ашты (${esc(s.host_name)}) — оны сол бастайды.</span>`}`;
    else if(s.status==='running') h+=`<div class="card" style="text-align:center">${head}<h2 style="margin:8px 0 0">${esc(stName(s))} · жарыс жүріп жатыр</h2>
        <div style="font-family:var(--disp);font-weight:600;font-size:clamp(3rem,12vw,6rem);font-variant-numeric:tabular-nums" id="rleft"></div>
        <p style="margin:0;font-weight:800">${s.players.filter(p=>p.done).length} / ${s.players.length} аяқтады</p></div>
      <div class="card"><p style="margin:0;line-height:2">${s.players.map(p=>`<span class="chip" style="${p.done?'background:var(--good);color:#fff':''}">${esc(p.name)}${p.done?' ✓':''}</span>`).join(' ')}</p></div>
      <button class="btn plain" id="rclose" data-arm="1">${T.rarm?'Иә, аяқтау — тапсырмағандар соңғы орын алады':'Қазір аяқтау'}</button> <span class="note">Уақыт біткенде немесе бәрі тапсырғанда жарыс өзі аяқталады.</span>`;
    else if(s.cancelled) h+=`<div class="card">${head}<h2>Бөлме жабылды</h2><p class="note">Жарыс басталмады.</p></div>`;
    else { const rk=(s.ranking||[]).map(k=>Object.assign({},k,{odd:!!(k.finished&&QS&&k.sheet!==MYP),det:Array.isArray(k.detail)?k.detail:[]}));
      const miss=QS?QS.map((q,i)=>{ const pl=rk.filter(k=>k.finished&&!k.odd); return {q,of:pl.length,wrong:pl.filter(k=>!(k.det[i]&&k.det[i].ok===true)).length}; }).filter(m=>m.wrong>0).sort((x,y)=>y.wrong-x.wrong).slice(0,5):[];
      h+=`<div class="card">${head}<h2>${esc(stName(s))} · нәтиже</h2><div style="overflow-x:auto"><table class="t3"><tr><th>Орын</th><th>Оқушы</th><th>Дұрыс</th><th>Уақыт</th><th>Қате жауаптары</th></tr>
        ${rk.map(k=>{ const bad=k.det.map((d,i)=>({d,i})).filter(x=>x.d&&x.d.ok!==true).slice(0,6);
          return `<tr><td><b>${k.finished?num(k.place):'—'}</b></td><td style="text-align:left"><b>${esc(k.name)}</b>${k.odd?' <span class="chip gold" title="Бұл құрылғыда есептер басқаша шықты">⚠ басқа парақ</span>':''}</td><td style="${k.finished&&num(k.ok)*2<num(k.total)?'color:var(--bad)':''}">${k.finished?num(k.ok)+' / '+num(k.total):'тапсырмады'}</td><td>${k.finished?Math.round(num(k.ms)/1000)+' с':''}</td>
          <td style="text-align:left;font-size:.85rem">${bad.map(x=>{ const q=QS&&!k.odd?QS[x.i]:null; return `${q?qHTML(q):'<span class="muted">(оқушы құрылғысының жазуы)</span> '+esc(x.d.q)} → <b>${esc(x.d.g===''?'—':x.d.g)}</b> <span class="muted">(${q?aHTML(q):esc(x.d.a)})</span>`; }).join('<br>')}</td></tr>`; }).join('')}</table></div>
        <p class="note" style="margin-top:8px">Алдымен дұрыс жауап саны, тең болса — уақыт (сервер сағаты бойынша). Оқушылар тек үздік үштікті және өз орнын көреді. Есептер мен дұрыс жауаптар осы бетте бөлменің «тұқымынан» қайта құрылған; оқушыдан тек оның терген жауабы мен дұрыс/қате белгісі алынады (жауапты жаттығудағыдай оқушының браузері тексереді). «⚠ басқа парақ» — сол құрылғыда есептер басқаша шыққан.</p></div>
      ${miss.length?`<div class="card"><h2>Сынып жиі қателескен есептер</h2><div class="kv">${miss.map(m=>`<span>${qHTML(m.q)} <span class="muted">= ${aHTML(m.q)}</span></span><span>${m.wrong} / ${m.of} қате</span>`).join('')}</div></div>`:''}
      <button class="btn gold" onclick="showRooms()">Тағы бір бөлме</button>`; }
    T.app.innerHTML=h+`</div>`;
    if($('rstart')) $('rstart').onclick=async()=>{ $('rstart').disabled=true; let r; try{ r=await trpc('esep_t_room_start',{p_id:id}); }catch(e){ r={error:e.message}; } if(r&&r.error){ $('rmsg2').textContent=RWHY[r.error]||r.error; $('rstart').disabled=false; return; } showRoom(id); };
    if($('rclose')) $('rclose').onclick=async()=>{ if($('rclose').dataset.arm&&!T.rarm){ T.rarm=true; $('rclose').textContent='Иә, аяқтау — тапсырмағандар соңғы орын алады'; return; }   // ending a race takes two taps, no dialog
      try{ await trpc('esep_t_room_close',{p_id:id}); }catch(e){} showRoom(id); }; }
  if($('rleft')) $('rleft').textContent=num(s.starts_in)>0?Math.ceil(num(s.starts_in)/1000):mmss(s.left);
  if(s.status!=='done') T.rpoll=setTimeout(()=>showRoom(id,true),s.status==='running'?1000:2000); }

showTeacher();
</script>
