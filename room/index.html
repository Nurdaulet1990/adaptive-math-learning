<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Есеп жолы · Жарыс бөлмесі</title>
<meta name="google" content="notranslate">
<script>try{if((localStorage.getItem('esep_lang')||'').indexOf('ru')>-1)document.querySelector('meta[name=google]').remove();}catch(e){}</script>
<link rel="stylesheet" href="../core/ui.css?v=9">
<style>
/* room/ — a challenge room («жарыс бөлмесі»): one pupil or the teacher opens it, anyone with the code comes in,
   everybody gets the same ten facts at the same moment. Owner: platform owner. All rules live on the server
   (supabase/05_rooms.sql); this page only shows what the functions return and collects ten answers. */
.code{font-family:var(--disp);font-weight:600;font-size:3.4rem;letter-spacing:.18em;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;padding-left:.18em}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.plist span{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.9rem}
.plist span.done{background:var(--good-soft,#DDF2E3);color:var(--good)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{min-height:54px;border-radius:15px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-align:left;padding:8px 14px}
.joinrow{display:flex;gap:8px}.joinrow input{flex:1;min-width:0;font-family:var(--disp);font-size:1.6rem;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums}
.open{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.open:last-child{border-bottom:0}
.open span{flex:1;min-width:0;font-weight:900}.open small{display:block;font-weight:700;color:var(--muted)}
.rec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.rec b{display:block;font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums}.rec span{font-size:.75rem;font-weight:800;color:var(--muted)}
.count{font-family:var(--disp);font-weight:600;font-size:7rem;text-align:center;margin:60px 0 10px;font-variant-numeric:tabular-nums}
.marks{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.marks i{height:12px;border-radius:999px;background:var(--line)}
.marks i.ok{background:var(--good)}.marks i.no{background:var(--bad)}.marks i.on{background:var(--gold)}
.fact{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--disp);font-weight:600;font-size:2.9rem;font-variant-numeric:tabular-nums;margin:28px 0}
.fact output{min-width:108px;height:76px;padding:0 12px;border-radius:16px;border:3px solid var(--gold);background:var(--card);display:flex;align-items:center;justify-content:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:62px;border:0;border-radius:15px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);font-family:var(--disp);font-weight:600;font-size:1.6rem;cursor:pointer}
.kp button:active{transform:translateY(4px);box-shadow:none}.kp button.go{background:var(--gold);color:#1B2733;box-shadow:0 4px 0 var(--gold-d)}
.res{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.res:last-child{border-bottom:0}
.res i{flex:none;font-style:normal;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;background:var(--gold-soft);color:var(--gold-d)}
.res span{flex:1;min-width:0;font-weight:900}.res small{display:block;font-weight:700;color:var(--muted)}.res b{font-family:var(--disp);font-size:1.5rem;font-variant-numeric:tabular-nums}
.res.me{background:var(--accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px;border-bottom:0}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script src="../core/core.js?v=10"></script>
<script>
(async function(){
  'use strict';
  const app=document.getElementById('app'), esc=Core.esc, $=id=>document.getElementById(id);
  await Core.login();
  const first=s=>String(s||'').split(' ')[0];
  const tbl=n=>+n===0?'Аралас кестелер':(+n)+({2:'-ге',3:'-ке',4:'-ке',5:'-ке',6:'-ға',7:'-ге',8:'-ге',9:'-ға',10:'-ға'}[+n]||'-ге')+' көбейту';
  const top=()=>Core.topbar('Жарыс бөлмесі');
  const home=`<p class="note" style="margin:0 0 10px"><a href="../">← Басты бет</a></p>`;
  const WHY={not_found:'Мұндай бөлме жоқ немесе ол жабылып қалған.',started:'Бұл жарыс басталып кетті — келесісіне үлгер.',hosting:'Алдымен өз бөлмеңді жап.',playing:'Сен қазір басқа жарыста ойнап жатырсың.',
    full:'Бөлме толы.',not_passed:'Бөлмені тек өзің өткен кесте бойынша аша аласың.',daily_limit:'Бүгінге 5 бөлме жеткілікті. Ертең тағы аш.',alone:'Кемінде екі ойыншы керек.',closed:'Уақыт бітіп қалды.',
    busy:'Қазір бос код жоқ. Сәлден соң қайтала.',locked:'Тым көп қате код. 10 минуттан кейін қайтала.',table:'Мұндай кесте жоқ.',session:'Қайта кіру керек.'};
  const fail=code=>{ stop(); app.innerHTML=top()+`<div class="card"><h2>${esc(WHY[code]||'Бөлме қазір қолжетімсіз.')}</h2><a class="btn wide" href="./">Бөлмелер</a></div>`; };
  const mmss=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  let poll=null, tick=null, watch=null, G=null, seq=0;
  /* every view change bumps `seq`: a reply that was already on its way when the view changed is dropped, not drawn */
  const stop=()=>{ seq++; clearTimeout(poll); clearInterval(tick); clearInterval(watch); poll=tick=watch=null; document.onkeydown=null; };
  /* school wifi hangs more often than it fails: no call may wait longer than 8 s */
  const call=(fn,a)=>Promise.race([Core.call(fn,a),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),8000))]);
  const SS={get:k=>{ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }, set:(k,v)=>{ try{ sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del:k=>{ try{ sessionStorage.removeItem(k); }catch(e){} }};

  /* ── the way in: my live room · come in by code · my class's open rooms · open one · my record ── */
  async function hub(msg){ stop(); let l; try{ l=await call('esep_room_list'); }catch(e){ return fail(); } if(!l) return fail('session');
    const rec=l.record||{}, can=l.can_host||[];
    let h=top()+home;
    if(l.mine) h+=`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><h2 style="margin:0 0 2px">${l.mine.status==='running'?'Жарыс жүріп жатыр!':l.mine.is_host?'Сенің бөлмең ашық':'Сен бөлмедесің'}</h2>
      <p style="margin:0 0 12px;font-weight:700">${esc(tbl(l.mine.table))} · код ${esc(l.mine.code)}</p><a class="btn gold wide" href="./?id=${+l.mine.id}">Бөлмеге кіру</a></div>`;
    h+=`<div class="card"><h1 style="margin:0 0 4px">Кодпен кіру</h1><p class="note" style="margin:0 0 10px">Бөлмені ашқан адам айтқан 4 санды жаз.</p>
      <div class="joinrow"><input class="big" id="jcode" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off" aria-label="Бөлме коды"><button class="btn gold" id="jgo">Кіру</button></div>
      <p class="note" id="jmsg" style="margin:8px 0 0;color:var(--bad)">${esc(msg||'')}</p></div>`;
    if((l.open||[]).length) h+=`<div class="card" style="padding-top:6px;padding-bottom:6px"><h2 style="margin:10px 0 0">Сыныбыңдағы ашық бөлмелер</h2>${l.open.map(o=>`<div class="open"><span>${esc(o.by_teacher?'Мұғалім':first(o.host_name))}<small>${esc(tbl(o.table))} · ${+o.n} ойыншы</small></span><button class="btn" data-code="${esc(o.code)}">Қосылу</button></div>`).join('')}</div>`;
    if(!l.mine) h+=`<div class="card"><h2 style="margin:0 0 4px">Бөлме ашу</h2>${can.length?`<p class="note" style="margin:0 0 10px">Өзің өткен кестені таңда. Саған код беріледі — оны сыныптастарыңа айт.</p>
        <div class="pick">${can.map(t=>`<button type="button" data-new="${+t}">${esc(tbl(t))}</button>`).join('')}${can.length>=2?`<button type="button" data-new="0">Аралас кестелер</button>`:''}</div><p class="note" id="nmsg" style="margin:8px 0 0;color:var(--bad)"></p>`
        :`<p class="note" style="margin:0">Бөлме ашу үшін алдымен «Көбейту мен бөлу» бағытында бір кесте станциясынан өт. Оған дейін кодпен басқаның бөлмесіне кіре аласың.</p>`}</div>`;
    if(rec.played) h+=`<div class="card"><h2 style="margin:0 0 10px">Менің жарыстарым</h2><div class="rec"><div><b>${+rec.played}</b><span>жарыс</span></div><div><b>${+rec.wins}</b><span>1-орын</span></div><div><b>${+rec.podium}</b><span>үздік үштік</span></div><div><b>${+rec.beaten}</b><span>озған адам</span></div></div>
      ${(l.last||[]).length?`<p class="note" style="margin:12px 0 0">Соңғылары: ${l.last.map(x=>`${esc(tbl(x.table))} — ${+x.place}-орын (${+x.n} ішінен)`).join(' · ')}</p>`:''}</div>`;
    h+=`<p class="note center"><a href="../challenge/">Бір сыныптаспен жекпе-жек жарыс →</a></p>`;
    app.innerHTML=h;
    const join=async code=>{ const m=$('jmsg'); if(!/^\d{4}$/.test(code)){ m.textContent='Код — 4 сан.'; return; } m.textContent='';
      let r; try{ r=await call('esep_room_join',{p_code:code}); }catch(e){ m.textContent='Байланыс жоқ. Қайтала.'; return; }
      if(!r||r.error){ m.textContent=WHY[r&&r.error]||'Болмады.'; return; }
      try{ if(r.not_passed) sessionStorage.setItem('esep_room_np',String(r.id)); }catch(e){}
      location.href='./?id='+(+r.id); };
    $('jgo').onclick=()=>join(($('jcode').value||'').trim()); $('jcode').onkeydown=e=>{ if(e.key==='Enter') $('jgo').click(); };
    app.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>join(b.dataset.code));
    app.querySelectorAll('[data-new]').forEach(b=>b.onclick=async()=>{ app.querySelectorAll('[data-new]').forEach(x=>x.disabled=true);
      let r; try{ r=await call('esep_room_create',{p_table:+b.dataset.new}); }catch(e){ r=null; }
      if(!r||r.error){ $('nmsg').textContent=WHY[r&&r.error]||'Байланыс жоқ. Қайтала.'; app.querySelectorAll('[data-new]').forEach(x=>x.disabled=false); return; }
      location.href='./?id='+(+r.id); }); }

  /* ── inside a room: lobby → countdown → ten facts → waiting → podium. The server says which. ── */
  async function room(id){ clearTimeout(poll); const my=++seq; let s; try{ s=await call('esep_room_state',{p_id:id}); }catch(e){ if(my===seq) poll=setTimeout(()=>room(id),3000); return; }
    if(my!==seq) return;   // the view moved on while this reply was in the air
    if(!s||s.error) return fail(s&&s.error);
    if(s.status==='lobby') lobby(id,s);
    else if(s.status==='running'){ if(s.my_done) waiting(id,s); else if(!G){ stop(); return countdown(id,s); } else return; }
    else return podium(id,s);
    poll=setTimeout(()=>room(id),2000); }

  let lobbyKey='';
  function lobby(id,s){ if(G) return; const key=JSON.stringify(s); if(key===lobbyKey&&document.getElementById('rcode')) return; lobbyKey=key;   // redraw only when somebody came or went — a button must not vanish under a finger
    let np=false; try{ np=sessionStorage.getItem('esep_room_np')===String(id); }catch(e){}
    app.innerHTML=top()+`<div class="card center"><p class="note" style="margin:0;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Бөлме коды</p><div class="code" id="rcode">${esc(s.code)}</div>
        <h2 style="margin:0">${esc(tbl(s.table))}</h2><p class="note" style="margin:2px 0 0">${s.by_teacher?'Бөлмені мұғалім ашты':s.is_host?'Кодты сыныптастарыңа айт':esc(first(s.host_name))+' ашқан бөлме'}</p></div>
      ${np?`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><b>Бұл кестені әлі өткен жоқсың — бәрібір қатыса аласың. Білгеніңше жауап бер.</b></div>`:''}
      <div class="card"><h2 style="margin:0">Ойыншылар · ${+s.n}</h2><div class="plist">${(s.players||[]).map(p=>`<span>${esc(first(p))}</span>`).join('')}</div></div>
      ${s.is_host?`<button class="btn gold wide" id="startBtn" ${s.n<2?'disabled':''}>Бастау</button><p class="note center" id="lmsg" style="margin:8px 0 0">${s.n<2?'Кемінде екі ойыншы керек.':'Бәрі жиналғанда баста — кейін ешкім кіре алмайды.'}</p><div style="height:6px"></div><button class="btn plain wide" id="leaveBtn">Бөлмені жабу</button>`
        :`<div class="card center"><b>${s.by_teacher?'Мұғалім':esc(first(s.host_name))} бастағанша күт…</b></div><button class="btn plain wide" id="leaveBtn">Шығу</button>`}`;
    if($('startBtn')) $('startBtn').onclick=async()=>{ $('startBtn').disabled=true; let r; try{ r=await call('esep_room_start',{p_id:id}); }catch(e){ r=null; }
      if(!r||r.error){ if($('lmsg')) $('lmsg').textContent=WHY[r&&r.error]||'Байланыс жоқ. Қайтала.'; if($('startBtn')) $('startBtn').disabled=false; return; } room(id); };
    $('leaveBtn').onclick=async()=>{ stop(); try{ await call('esep_room_leave',{p_id:id}); }catch(e){} location.href='./'; }; }

  function countdown(id,s){ const kept=SS.get('esep_room_g_'+id)||{};   // a reload mid-race resumes where it was — and gains nothing: the clock is the server's
    G={id,items:s.items,table:s.table,ans:Array.isArray(kept.ans)?kept.ans.slice(0,s.items.length-1):[],input:'',deadline:Date.now()+s.left}; G.i=G.ans.length;
    if(s.starts_in<=0) return play(id);
    const t0=Date.now()+s.starts_in;
    app.innerHTML=`<div class="quiz"><p class="note center" style="margin:30px 0 0;font-weight:800">${esc(tbl(s.table))} · 10 есеп</p><div class="count" id="cnt"></div><p class="note center">Дайындал!</p></div>`;
    const step=()=>{ const left=t0-Date.now(); if(left<=0){ clearInterval(tick); tick=null; return play(id); } if($('cnt')) $('cnt').textContent=Math.ceil(left/1000); }; tick=setInterval(step,100); step(); }

  function play(id){ G.t0=Date.now();
    app.innerHTML=`<div class="quiz" style="padding-bottom:20px"><div class="qtop"><div class="marks" id="marks">${G.items.map(()=>'<i></i>').join('')}</div><span class="qmeta" id="clock"></span></div>
      <p class="note center" id="qn" style="margin:0;font-weight:800;letter-spacing:.06em"></p><div class="fact"><span id="qt"></span><span>=</span><output id="out" aria-live="polite"></output></div>
      <div class="kp">${['1','2','3','4','5','6','7','8','9','←','0','OK'].map(k=>`<button type="button" data-k="${k}" class="${k==='OK'?'go':''}" aria-label="${k==='←'?'Өшіру':k==='OK'?'Тексеру':k}">${k}</button>`).join('')}</div></div>`;
    const show=()=>{ const [a,b]=G.items[G.i]; $('qt').textContent=`${a} × ${b}`; $('qn').textContent=`${G.i+1} / ${G.items.length}`; $('out').textContent=G.input||' ';
      document.querySelectorAll('#marks i').forEach((m,j)=>{ m.className=j<G.ans.length?(G.ans[j]===G.items[j][0]*G.items[j][1]?'ok':'no'):j===G.i?'on':''; }); };
    const press=k=>{ if(!G||G.over) return;
      if(k==='←') G.input=G.input.slice(0,-1); else if(k==='OK'){ if(!G.input) return; G.ans.push(+G.input); G.input=''; G.i++; SS.set('esep_room_g_'+id,{ans:G.ans}); if(G.i>=G.items.length) return finish(id); }
      else G.input=(G.input+k).slice(0,3); show(); };
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ b.blur(); press(b.dataset.k); });   // blur: or Enter would ALSO press the focused key
    document.onkeydown=e=>{ const k=/^\d$/.test(e.key)?e.key:e.key==='Backspace'?'←':e.key==='Enter'?'OK':null; if(k){ e.preventDefault(); press(k); } };
    tick=setInterval(()=>{ if(!G) return; const left=G.deadline-Date.now(), el=$('clock'); if(el) el.textContent=mmss(left); if(left<=0) finish(id); },250);   // the three minutes are up: hand in what there is
    /* a light look at the room while playing: the host or the teacher may end the race early */
    watch=setInterval(async()=>{ const my=seq; let x; try{ x=await call('esep_room_state',{p_id:id}); }catch(e){ return; } if(my!==seq||!G||G.over) return; if(x&&x.status==='done'){ stop(); G=null; SS.del('esep_room_g_'+id); podium(id,x); } },4000);
    show(); }

  async function finish(id){ if(!G||G.over) return; G.over=true; clearInterval(tick); clearInterval(watch); tick=watch=null; document.onkeydown=null; const ms=Date.now()-G.t0;
    app.innerHTML=top()+`<div class="card"><p>Жіберілуде…</p></div>`;
    let r=null; for(let k=0;k<3&&!r;k++){ try{ r=await call('esep_room_submit',{p_id:id,p_answers:G.ans,p_ms:ms}); }catch(e){ await new Promise(z=>setTimeout(z,1500)); } }
    if(!r){ app.innerHTML=top()+`<div class="card"><h2>Интернет жоқ</h2><p>Жауаптарың осы бетте тұр — бетті жаппа. Байланыс шыққанда батырманы бас; жарыс уақыты біткенше үлгеру керек.</p><button class="btn wide" id="again">Қайта жіберу</button></div>`; $('again').onclick=()=>{ G.over=false; finish(id); }; return; }
    try{ sessionStorage.setItem('esep_room_miss_'+id,JSON.stringify(G.items.map(([a,b],j)=>G.ans[j]===a*b?null:`${a} × ${b} = ${a*b}`).filter(Boolean))); }catch(e){}
    SS.del('esep_room_g_'+id);
    if(r.error&&r.error!=='closed') return fail(r.error);
    G=null; room(id); }

  function waiting(id,s){ app.innerHTML=top()+`<div class="card center"><h1 style="margin:6px 0 2px">Жауаптарың қабылданды</h1><p class="note" style="margin:0">${esc(tbl(s.table))} · сен ${+s.my_ok} / 10</p></div>
      <div class="card center"><b>${+s.done_count} / ${+s.n} ойыншы аяқтады</b><p class="note" style="margin:6px 0 0">Қалғандарын күтеміз · ${mmss(s.left)} қалды</p></div>
      ${s.is_host?`<button class="btn plain wide" id="endBtn">${endArmed?'Иә, қазір аяқтау — тапсырмағандар соңғы орын алады':'Күтпей аяқтау'}</button>`:''}`;
    if($('endBtn')) $('endBtn').onclick=async()=>{ if(!endArmed){ endArmed=true; $('endBtn').textContent='Иә, қазір аяқтау — тапсырмағандар соңғы орын алады'; return; }   // two taps, no dialog
      $('endBtn').disabled=true; try{ await call('esep_room_finish',{p_id:id}); }catch(e){} room(id); }; }
  let endArmed=false;

  function podium(id,s){ stop(); G=null; SS.del('esep_room_g_'+id); if(s.cancelled){ app.innerHTML=top()+`<div class="card"><h2>Бөлме жабылды</h2><p class="note">Жарыс басталмады.</p><a class="btn wide" href="./">Бөлмелер</a></div>`; return; }
    const me=s.me||{}; let miss=[]; try{ miss=JSON.parse(sessionStorage.getItem('esep_room_miss_'+id)||'[]'); sessionStorage.removeItem('esep_room_np'); }catch(e){}
    const onTop=(s.top||[]).some(t=>t.me);
    app.innerHTML=top()+`<div class="card center"><h1 style="margin:6px 0 2px">${!me.finished?'Бұл жолы үлгермедің':me.place===1?'Жеңдің!':me.place<=3?`${+me.place}-орын!`:`${+me.place}-орын`}</h1>
        <p class="note" style="margin:0">${esc(tbl(s.table))} · ${+s.n} ойыншы${me.finished&&me.beaten?` · сен ${+me.beaten} ойыншыдан оздың`:''}</p></div>
      <div class="card" style="padding-top:4px;padding-bottom:4px">${(s.top||[]).map(t=>`<div class="res${t.me?' me':''}"><i>${+t.place}</i><span>${esc(t.me?'Сен':first(t.name))}<small>${Math.round(t.ms/1000)} секунд</small></span><b>${+t.ok} / 10</b></div>`).join('')}
        ${me.finished&&!onTop?`<div class="res me"><i>${+me.place}</i><span>Сен<small>${Math.round(me.ms/1000)} секунд</small></span><b>${+me.ok} / 10</b></div>`:''}</div>
      ${me.stars?`<div class="card" style="background:var(--gold-soft);border-color:var(--gold)"><b>★ Саған ${+me.stars} жұлдыз.</b> <span class="note">Алдымен дұрыс жауап саны есептеледі, тең болса — уақыт.</span></div>`:''}
      ${miss.length?`<div class="card"><h2>Қайталап ал</h2><p style="font-family:var(--disp);font-size:1.15rem;margin:0;font-variant-numeric:tabular-nums">${miss.map(m=>`<span style="white-space:nowrap">${esc(m)}</span>`).join(' &nbsp;·&nbsp; ')}</p></div>`:''}
      <a class="btn wide" href="./">Тағы бір жарыс</a><div style="height:10px"></div><a class="btn plain wide" href="../">Басты бетке</a>`; }

  const q=new URLSearchParams(location.search), id=+q.get('id'), code=(q.get('code')||'').trim();
  if(id>0) room(id);
  else if(/^\d{4}$/.test(code)){   // «Қосылу» on the portal: come straight in
    let r; try{ r=await call('esep_room_join',{p_code:code}); }catch(e){ r=null; }
    if(r&&r.id){ try{ if(r.not_passed) sessionStorage.setItem('esep_room_np',String(r.id)); }catch(e){} history.replaceState(null,'','./?id='+(+r.id)); room(+r.id); }
    else { history.replaceState(null,'','./'); hub(WHY[r&&r.error]||'Байланыс жоқ. Қайтала.'); } }
  else hub();
})();
</script>
</body>
</html>
